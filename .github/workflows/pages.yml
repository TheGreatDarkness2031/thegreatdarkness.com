# Publishes the website and rebuilds /feed.xml from the live event feed.
# Runs on every change, when Apps Script asks (every 30 minutes), and on
# a timer as a backup. If the event feed can't be read, the last
# published feed.xml is kept.
name: Publish site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [refresh-feed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build feed.xml
        run: |
          API="https://script.google.com/macros/s/AKfycbxXsPZtr6ZIqLcBIJeiLeoYSoOQQjKX2zDHsmd0Qn0dalEjgtD6hldIWEkQQFGx0K0GFg/exec?rss=1"
          ok() { head -c 200 "$1" | grep -q '<rss' && grep -q '</rss>' "$1"; }
          if curl -sSL --max-time 90 --retry 2 -o feed.new "$API" && ok feed.new; then
            mv feed.new feed.xml
            echo "feed.xml rebuilt: $(grep -c '<item>' feed.xml) items"
          elif curl -sSL --max-time 30 -o feed.old "https://thegreatdarkness.com/feed.xml" && ok feed.old; then
            mv feed.old feed.xml
            echo "::warning::Event feed unreadable; kept the published feed.xml"
          else
            echo "::warning::No feed.xml available this run"
          fi
          rm -f feed.new feed.old

      # Static copies of the Watch and Maintenance logs (2026-11-09): the
      # pages read these instead of waiting for Apps Script (assets/logs-local.js).
      # A file that can't be rebuilt keeps its published copy.
      - name: Build log data files
        run: |
          BASE="https://script.google.com/macros/s/AKfycbxXsPZtr6ZIqLcBIJeiLeoYSoOQQjKX2zDHsmd0Qn0dalEjgtD6hldIWEkQQFGx0K0GFg/exec"
          LIVE="https://thegreatdarkness.com/data"
          valid() { node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.exit(d&&d.ok===true?0:1)' "$1" 2>/dev/null; }
          save() {  # save <query> <file>
            if curl -sSL --max-time 170 --retry 2 -o "$2.new" "$BASE?$1" && valid "$2.new"; then
              mv "$2.new" "$2"; echo "rebuilt $2 ($(wc -c < "$2") bytes)"
            elif curl -sSL --max-time 30 -o "$2.old" "$LIVE/${2#data/}" && valid "$2.old"; then
              mv "$2.old" "$2"; echo "::warning::kept the published $2"
            else
              echo "::warning::no $2 this run"
            fi
            rm -f "$2.new" "$2.old"
          }
          mkdir -p data/watch
          save "logexport=watchindex" data/watch/index.json
          save "logexport=maintenance" data/maintenance.json
          save "logexport=schedule" data/schedule.json
          if [ -f data/watch/index.json ]; then
            for s in $(node -e 'JSON.parse(require("fs").readFileSync("data/watch/index.json","utf8")).years.forEach(y=>console.log(y.sheetName))'); do
              case "$s" in *[!A-Za-z0-9_]*) echo "::warning::skipped sheet name $s"; continue;; esac
              save "logexport=watch&sheet=$s" "data/watch/$s.json"
            done
          fi
          # Maintenance log by year (2026-11-11): data/maintenance/index.json + <year>.json.
          mkdir -p data/maintenance
          save "logexport=maintindex" data/maintenance/index.json
          if [ -f data/maintenance/index.json ]; then
            for y in $(node -e 'JSON.parse(require("fs").readFileSync("data/maintenance/index.json","utf8")).years.forEach(y=>console.log(y.year))'); do
              case "$y" in [0-9][0-9][0-9][0-9]) ;; *) echo "::warning::skipped year $y"; continue;; esac
              save "logexport=maintenance&year=$y" "data/maintenance/$y.json"
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
