# Publishes the website and rebuilds /feed.xml from the live event feed.
# Runs on every change, when Apps Script asks (every 30 minutes), and on
# a timer as a backup. If the event feed can't be read, the last
# published feed.xml is kept.
name: Publish site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [refresh-feed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build feed.xml
        run: |
          API="https://script.google.com/macros/s/AKfycbxXsPZtr6ZIqLcBIJeiLeoYSoOQQjKX2zDHsmd0Qn0dalEjgtD6hldIWEkQQFGx0K0GFg/exec?rss=1"
          ok() { head -c 200 "$1" | grep -q '<rss' && grep -q '</rss>' "$1"; }
          if curl -sSL --max-time 90 --retry 2 -o feed.new "$API" && ok feed.new; then
            mv feed.new feed.xml
            echo "feed.xml rebuilt: $(grep -c '<item>' feed.xml) items"
          elif curl -sSL --max-time 30 -o feed.old "https://thegreatdarkness.com/feed.xml" && ok feed.old; then
            mv feed.old feed.xml
            echo "::warning::Event feed unreadable; kept the published feed.xml"
          else
            echo "::warning::No feed.xml available this run"
          fi
          rm -f feed.new feed.old

      # Static copies of the Watch and Maintenance logs (2026-11-09): the
      # pages read these instead of waiting for Apps Script (assets/logs-local.js).
      # A file that can't be rebuilt keeps its published copy.
      - name: Build log data files
        run: |
          BASE="https://script.google.com/macros/s/AKfycbxXsPZtr6ZIqLcBIJeiLeoYSoOQQjKX2zDHsmd0Qn0dalEjgtD6hldIWEkQQFGx0K0GFg/exec"
          LIVE="https://thegreatdarkness.com/data"
          valid() { node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.exit(d&&d.ok===true?0:1)' "$1" 2>/dev/null; }
          save() {  # save <query> <file>
            if curl -sSL --max-time 170 --retry 2 -o "$2.new" "$BASE?$1" && valid "$2.new"; then
              mv "$2.new" "$2"; echo "rebuilt $2 ($(wc -c < "$2") bytes)"
            elif curl -sSL --max-time 30 -o "$2.old" "$LIVE/${2#data/}" && valid "$2.old"; then
              mv "$2.old" "$2"; echo "::warning::kept the published $2"
            else
              echo "::warning::no $2 this run"
            fi
            rm -f "$2.new" "$2.old"
          }
          mkdir -p data/watch
          save "logexport=watchindex" data/watch/index.json
          save "logexport=maintenance" data/maintenance.json
          save "logexport=schedule" data/schedule.json
          if [ -f data/watch/index.json ]; then
            for s in $(node -e 'JSON.parse(require("fs").readFileSync("data/watch/index.json","utf8")).years.forEach(y=>console.log(y.sheetName))'); do
              case "$s" in *[!A-Za-z0-9_]*) echo "::warning::skipped sheet name $s"; continue;; esac
              save "logexport=watch&sheet=$s" "data/watch/$s.json"
            done
          fi
          # Maintenance log by year (2026-11-11): data/maintenance/index.json + <year>.json.
          mkdir -p data/maintenance
          save "logexport=maintindex" data/maintenance/index.json
          if [ -f data/maintenance/index.json ]; then
            for y in $(node -e 'JSON.parse(require("fs").readFileSync("data/maintenance/index.json","utf8")).years.forEach(y=>console.log(y.year))'); do
              case "$y" in [0-9][0-9][0-9][0-9]) ;; *) echo "::warning::skipped year $y"; continue;; esac
              save "logexport=maintenance&year=$y" "data/maintenance/$y.json"
            done
          fi

      # Monitor snapshots (2026-11-12): each monitor page's first answers, so
      # the page shows them at once and then the live answer (assets/gsr.js).
      # Keys are <function>+JSON args exactly as the pages call them;
      # tests/test_monitor_snapshot.js keeps this list in step with the pages.
      - name: Build monitor snapshot
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const BASE = "https://script.google.com/macros/s/AKfycbxXsPZtr6ZIqLcBIJeiLeoYSoOQQjKX2zDHsmd0Qn0dalEjgtD6hldIWEkQQFGx0K0GFg/exec";
          const CALLS = [
            ["getTgdMonitorPage", ["spacewx", "24H"]], ["getTgdMonitorPage", ["severewx", "24H"]],
            ["getTgdMonitorPage", ["wildfire", "24H"]], ["getTgdMonitorPage", ["volcano", "24H"]],
            ["getTgdMonitorPage", ["netout", "24H"]], ["getTgdMonitorPage", ["gps", "24H"]],
            ["getTgdMonitorPage", ["aiinc", "24H"]], ["getTgdMonitorPage", ["neo", "24H"]],
            ["getQuakeStatus", []], ["getQuakeHistory", ["24H"]],
            ["getTempViewSummary", []], ["getTempHistHistory", ["HOUR"]],
            ["getPowerGridRealStatus", []], ["getPowerGridRealHistory", ["24H"]]
          ];
          (async () => {
            const answers = {};
            // The published copy: any answer that can't be fetched now keeps its last copy.
            let old = {};
            try { const r = await fetch("https://thegreatdarkness.com/data/monitors.json", { signal: AbortSignal.timeout(20000) }); const d = await r.json(); if (d && d.ok) old = d.answers || {}; } catch (e) {}
            for (const [name, args] of CALLS) {
              const key = name + JSON.stringify(args);
              const url = BASE + "?rpc=" + encodeURIComponent(name) + "&args=" + encodeURIComponent(JSON.stringify(args));
              for (let attempt = 1; attempt <= 2 && !answers[key]; attempt++) {
                try {
                  const r = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(45000) });
                  const d = JSON.parse(await r.text());
                  if (d && d.ok === true && d.result && d.result.success !== false) answers[key] = d.result;
                  else console.log("::warning::snapshot answer refused " + key);
                } catch (e) {
                  console.log("::warning::snapshot try " + attempt + " failed " + key + ": " + e.message);
                }
              }
              if (!answers[key] && old[key]) { answers[key] = old[key]; console.log("::warning::kept the published copy of " + key); }
            }
            fs.mkdirSync("data", { recursive: true });
            if (Object.keys(answers).length) {
              fs.writeFileSync("data/monitors.json", JSON.stringify({ ok: true, built: new Date().toISOString(), answers }));
              console.log("monitor snapshot: " + Object.keys(answers).length + " of " + CALLS.length + " answers");
            } else {
              console.log("::warning::no monitor snapshot this run");
            }
          })();
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
