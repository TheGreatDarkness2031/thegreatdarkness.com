<style>
:root {
  --outer-gray: #404040;
  --dark-gray: #1a1a1a;
  --title-blue: #000080;
  --title-blue-dark: #00004f;
  --body-gray: #c4c4c4;
  --muted: #8a8a8a;
  --line: #4a4a4a;
  --green: #7fd18b;
  --red-crew: #e06c6c;
  --blue-crew: #7fa6ff;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; background: #101010; color: var(--body-gray); font-family: "Courier New", Courier, monospace; }
body { padding: 10px 12px 12px; }

/* Watch Schedule (2026-11-11): posted on the floor like the Personnel
   Office: a plate, bracket links like the homepage, the homepage's box. */
.office { width: 95%; max-width: 1000px; margin: 0 auto; }
.door { text-align: center; margin: 0 0 8px; }
.door-plate {
  display: inline-block; padding: 7px 30px 6px; background: linear-gradient(#2c2c2c, #151515);
  border: 2px solid #8a8a8a; box-shadow: inset 0 0 0 1px #000, inset 0 0 0 4px #3a3a3a, 4px 4px 0 #000;
}
.door-room { color: #9a9a9a; font-size: 0.66rem; letter-spacing: 4px; }
.door-name { color: #ececec; font-size: 1.2rem; font-weight: bold; letter-spacing: 6px; margin: 3px 0 2px; }
.door-hours { color: #8a8a8a; font-size: 0.62rem; letter-spacing: 2px; }
.office-nav { text-align: center; font-size: 0.74rem; letter-spacing: 1px; line-height: 1.9; margin: 0 0 8px; }
.office-nav a { color: var(--green); text-decoration: none; white-space: nowrap; margin: 0 2px; padding: 1px 2px; }
.office-nav a:hover { text-decoration: underline; }
.office-nav a.on { color: #000; background: var(--green); }
.desk { padding: 4px; background: #050505; border: 2px solid #888888; }
.pane { padding: 10px 16px 12px; border: 1px inset #888888; }
.pane h2 {
  margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px dashed #777777; text-align: center;
  color: #cccccc; font-size: 0.82rem; letter-spacing: 2px;
}
.pane h2::before { content: "=== "; }
.pane h2::after { content: " ==="; }
.note { color: var(--muted); font-size: 0.7rem; letter-spacing: 1px; margin: 0 0 14px; text-align: center; }

.crew-red { color: var(--red-crew); }
.crew-blue { color: var(--blue-crew); }

/* on the floor */
.now { display: grid; grid-template-columns: 260px 1fr; gap: 22px; align-items: start; }
.board { border: 2px inset #6a6a6a; background: #000; padding: 14px; text-align: center; }
.board .lbl { color: var(--muted); font-size: 0.65rem; letter-spacing: 2px; }
.board .big { font-size: 1.6rem; font-weight: bold; letter-spacing: 3px; margin: 4px 0 10px; }
.board .clock { color: #fff; font-size: 1.3rem; letter-spacing: 2px; margin: 4px 0 10px; }
.board .row { display: flex; justify-content: space-between; font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed #333; }
.board .row b { color: #eee; font-weight: normal; }
table.bill { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
table.bill th { text-align: left; color: #fff; letter-spacing: 1px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.bill td { padding: 6px 8px; border-bottom: 1px solid #262626; vertical-align: middle; }
table.bill td.seat { color: var(--muted); letter-spacing: 1px; white-space: nowrap; }
table.bill a { color: #eee; text-decoration: none; }
table.bill a:hover { color: var(--green); text-decoration: underline; }
table.bill .vacant { color: #555; font-style: italic; }
.since { color: var(--muted); font-size: 0.66rem; margin-left: 6px; }
.lit { background: #0b1a0b; }

/* rotation */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 6px; }
.cal-head a { color: var(--green); text-decoration: none; font-size: 0.75rem; letter-spacing: 1px; }
.cal-head a:hover { text-decoration: underline; }
.cal-head b { color: #fff; letter-spacing: 3px; }
table.cal { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 0.75rem; }
table.cal th { color: var(--muted); font-weight: normal; letter-spacing: 1px; padding: 4px; border-bottom: 1px solid var(--line); }
table.cal td { height: 40px; vertical-align: top; padding: 3px 6px; border: 1px solid #2a2a2a; background: #121212; }
table.cal td.empty { background: #0c0c0c; }
table.cal td .d { color: #aaa; }
table.cal td .c { display: block; margin-top: 3px; font-weight: bold; letter-spacing: 2px; }
table.cal td.red { background: #1d0f0f; }
table.cal td.blue { background: #0f1424; }
table.cal td.today { outline: 2px solid var(--green); outline-offset: -2px; }
.legend { margin: 6px 0 0; font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; line-height: 1.7; }
.cal-pick { display: flex; gap: 6px; align-items: center; }
.cal-pick select { background: #000; color: #fff; border: 1px solid #555; font: inherit; font-size: 0.75rem; letter-spacing: 1px; padding: 3px 4px; }
.rot-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
table.cal td.pickable { cursor: pointer; }
table.cal td.pickable:hover { outline: 1px solid #777; outline-offset: -1px; }
table.cal td.sel, table.cal td.sel:hover { outline: 2px solid #fff; outline-offset: -2px; }
.day-box { border: 2px inset #6a6a6a; background: #000; padding: 10px 12px 12px; }
.day-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 6px; }
.day-head b { color: #fff; }
.day-box .note { margin-bottom: 10px; }
.day-bill td { vertical-align: top; }
.day-bill .since { display: block; margin: 2px 0 0; font-size: 0.62rem; }
.log-link { display: inline-block; margin-top: 12px; color: var(--green); text-decoration: none; font-size: 0.74rem; letter-spacing: 1px; }
.log-link:hover { text-decoration: underline; }
@media (max-width: 900px) { .rot-wrap { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) {
  table.bill { table-layout: fixed; }
  table.bill th, table.bill td { white-space: normal; overflow-wrap: anywhere; padding: 5px 3px; font-size: 0.66rem; }
  table.bill th:first-child, table.bill td.seat { width: 30%; font-size: 0.56rem; letter-spacing: 0; overflow-wrap: normal; }
  .cal-head { flex-wrap: wrap; row-gap: 8px; }
  .cal-pick { order: 3; width: 100%; justify-content: center; }
  .day-box { padding: 10px 6px 12px; }
}

@media (max-width: 720px) {
  .now { grid-template-columns: 1fr; }
  .pane { padding: 12px 10px 18px; }
  .door-plate { padding: 10px 16px 9px; }
  .door-name { font-size: 1.05rem; letter-spacing: 4px; }
  table.bill { font-size: 0.72rem; }
  table.bill td, table.bill th { padding: 5px 4px; }
  table.cal td { height: 46px; padding: 3px; }
  table.cal td .c { margin-top: 4px; letter-spacing: 0; }
}
</style>

<body>
<div class="office">
  <div class="door">
    <div class="door-plate">
      <div class="door-room">POSTED // WATCH FLOOR</div>
      <div class="door-name">WATCH SCHEDULE</div>
      <div class="door-hours">RED CREW // BLUE CREW // FACILITY TIME: CENTRAL</div>
    </div>
  </div>
  <nav class="office-nav" id="tabs">
    <a href="?view=now" data-view="now">[ ON THE FLOOR ]</a>
    <a href="?view=bill" data-view="bill">[ WATCH BILL ]</a>
    <a href="?view=rotation" data-view="rotation">[ ROTATION ]</a>
  </nav>
  <div class="desk"><div class="pane" id="pane"></div></div>
</div>

<script src="/hr/data.js"></script>
<script>
(function () {
  var HR = window.HR || { people: [] };
  var pane = document.getElementById("pane");
  var MONTHS = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
  var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  var ROLES = ["Watch Lead", "Watch Monitoring", "Watch Correlation", "Watch COMM"];
  var ROLE_WORDS = { "Watch Lead": "LEAD", "Watch Monitoring": "MONITORING", "Watch Correlation": "CORRELATION", "Watch COMM": "COMM" };
  var DAY = 86400000;

  // The rotation was posted through the end of 2026 and never updated after
  // that (owner, 2026-11-13): it shows the plan as posted until then, and
  // nothing after.
  var POSTED_TO = "2026-12-31";
  var POSTED_END = Date.UTC(2027, 0, 1, 6, 0);   // midnight Central, 1 Jan 2027
  function ended() { return Date.now() >= POSTED_END; }

  // Red / Blue rotation: a 10-day cycle counted from 24 June 1998, Red on
  // days 0, 1, 5, 6, 7 (same rule as the watch log, WatchLogGen.js wlgCrew_).
  // A crew holds the floor 07:00-07:00: Day Watch to 19:00, then its Night Watch.
  function crewOn(y, m, d) {
    var n = Math.floor((Date.UTC(y, m, d) - Date.UTC(1998, 5, 24)) / DAY);
    n = ((n % 10) + 10) % 10;
    return [0, 1, 5, 6, 7].indexOf(n) >= 0 ? "Red" : "Blue";
  }

  // Facility (Central) wall-clock parts for an instant.
  function central(ms) {
    var f = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago", year: "numeric", month: "numeric", day: "numeric",
      hour: "numeric", minute: "2-digit", second: "2-digit", hourCycle: "h23", weekday: "short"
    });
    var o = {};
    f.formatToParts(new Date(ms)).forEach(function (p) { o[p.type] = p.value; });
    return { y: +o.year, m: +o.month - 1, d: +o.day, h: +o.hour, mi: +o.minute, s: +o.second, wd: o.weekday };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function today() { var c = central(Date.now()); return c.y + "-" + pad(c.m + 1) + "-" + pad(c.d); }

  // Current watch staff from the personnel file.
  function staff() {
    var t = today();
    return HR.people.filter(function (p) {
      return /^Watch /.test(p.title) && /Crew/.test(p.unit) && (!p.hire || p.hire <= t) && (!p.sep || p.sep >= t);
    });
  }
  function holder(list, crew, watch, role) {
    return list.filter(function (p) {
      return p.title === role && p.unit.indexOf(crew + " Crew") === 0 && (watch ? p.unit.indexOf(watch + " Watch") >= 0 : true);
    })[0];
  }
  function relief(list, crew) {
    return list.filter(function (p) { return p.title === "Watch Relief" && p.unit.indexOf(crew + " Crew") === 0; });
  }
  function nameCell(p) {
    var td = el("td");
    if (!p) { td.appendChild(el("span", "vacant", "VACANT // RELIEF COVER")); return td; }
    var a = el("a", null, p.name);
    a.href = "/hr/?id=" + encodeURIComponent(p.id);
    td.appendChild(a);
    return td;
  }

  function renderNow() {
    var c = central(Date.now());
    // Before 07:00 the night belongs to the previous day's crew.
    var base = c.h < 7 ? new Date(Date.UTC(c.y, c.m, c.d) - DAY) : new Date(Date.UTC(c.y, c.m, c.d));
    var crew = crewOn(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate());
    var watch = c.h >= 7 && c.h < 19 ? "Day" : "Night";
    var next = watch === "Day" ? "19:00 // " + crew.toUpperCase() + " NIGHT WATCH"
      : "07:00 // " + (function () {
        var nd = c.h < 7 ? new Date(Date.UTC(c.y, c.m, c.d)) : new Date(Date.UTC(c.y, c.m, c.d) + DAY);
        return crewOn(nd.getUTCFullYear(), nd.getUTCMonth(), nd.getUTCDate()).toUpperCase();
      })() + " DAY WATCH";

    var done = ended();
    if (done) {
      crew = "";
      next = "NOT POSTED";
    }
    pane.appendChild(el("h2", null, "ON THE FLOOR"));
    pane.appendChild(el("p", "note", "WATCH FLOOR STAFFING AT THIS HOUR. TURNOVER BRIEFINGS BEGIN 15 MINUTES BEFORE EACH CHANGE OF WATCH."));
    var wrap = el("div", "now");
    var board = el("div", "board");
    board.appendChild(el("div", "lbl", "FACILITY TIME"));
    var clock = el("div", "clock", "--:--:--");
    board.appendChild(clock);
    board.appendChild(el("div", "lbl", "CREW ON WATCH"));
    board.appendChild(el("div", "big" + (crew ? " crew-" + crew.toLowerCase() : ""), crew ? crew.toUpperCase() + " CREW" : "NONE"));
    [["WATCH", done ? "NONE POSTED" : watch.toUpperCase() + " WATCH"], ["HOURS", done ? "-" : watch === "Day" ? "07:00 - 19:00" : "19:00 - 07:00"], ["NEXT TURNOVER", next]].forEach(function (r) {
      var row = el("div", "row");
      row.appendChild(el("span", null, r[0]));
      row.appendChild(el("b", null, r[1]));
      board.appendChild(row);
    });
    wrap.appendChild(board);

    var list = staff();
    var t = el("table", "bill");
    var hr = el("tr");
    ["POSITION", "ON WATCH"].forEach(function (h) { hr.appendChild(el("th", null, h)); });
    t.appendChild(hr);
    function empty() { var td = el("td"); td.appendChild(el("span", "vacant", "NOT STAFFED")); return td; }
    ROLES.forEach(function (role) {
      var tr = el("tr");
      tr.appendChild(el("td", "seat", ROLE_WORDS[role]));
      tr.appendChild(done ? empty() : nameCell(holder(list, crew, watch, role)));
      t.appendChild(tr);
    });
    var tr = el("tr");
    tr.appendChild(el("td", "seat", "RELIEF"));
    tr.appendChild(done ? empty() : nameCell(relief(list, crew)[0]));
    t.appendChild(tr);
    wrap.appendChild(t);
    pane.appendChild(wrap);

    function tick() {
      var n = central(Date.now());
      clock.textContent = pad(n.h) + ":" + pad(n.mi) + ":" + pad(n.s);
    }
    tick();
    var timer = setInterval(function () { if (!document.body.contains(clock)) clearInterval(timer); else tick(); }, 1000);
  }

  function renderBill() {
    pane.appendChild(el("h2", null, "WATCH BILL"));
    pane.appendChild(el("p", "note", "STANDING SEAT ASSIGNMENTS, BOTH CREWS. A VACANT SEAT IS COVERED BY THE CREW RELIEF WATCHSTANDER."));
    var list = staff();
    var c = central(Date.now());
    var base = c.h < 7 ? new Date(Date.UTC(c.y, c.m, c.d) - DAY) : new Date(Date.UTC(c.y, c.m, c.d));
    var onCrew = crewOn(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate());
    var onWatch = c.h >= 7 && c.h < 19 ? "Day" : "Night";
    var cols = [["Red", "Day"], ["Red", "Night"], ["Blue", "Day"], ["Blue", "Night"]];
    var t = el("table", "bill");
    var hr = el("tr");
    hr.appendChild(el("th", null, "POSITION"));
    cols.forEach(function (k) {
      var th = el("th", "crew-" + k[0].toLowerCase(), k[0].toUpperCase() + " " + k[1].toUpperCase());
      hr.appendChild(th);
    });
    t.appendChild(hr);
    ROLES.forEach(function (role) {
      var tr = el("tr");
      tr.appendChild(el("td", "seat", ROLE_WORDS[role]));
      cols.forEach(function (k) {
        var td = nameCell(holder(list, k[0], k[1], role));
        if (k[0] === onCrew && k[1] === onWatch && !ended()) td.className = "lit";
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    var tr = el("tr");
    tr.appendChild(el("td", "seat", "RELIEF"));
    ["Red", "Blue"].forEach(function (crew) {
      var td = nameCell(relief(list, crew)[0]);
      td.colSpan = 2;
      tr.appendChild(td);
    });
    t.appendChild(tr);
    pane.appendChild(t);
    pane.appendChild(el("p", "legend", "HIGHLIGHTED: THE WATCH ON THE FLOOR NOW. NAMES OPEN THE PERSONNEL FILE."));
  }

  // ---- seat history (Watch_Assignments + Watch_Leave) ----
  // /data/schedule.json is rebuilt by the publish workflow (?logexport=schedule);
  // /schedule/seats.json is the copy kept in the repo for when it is missing.
  var seatData = null, seatWait = [], watchYears = null;
  function getSeats(cb) {
    if (seatData && watchYears) return cb(seatData);
    seatWait.push(cb);
    if (seatWait.length > 1) return;
    function get(url) {
      return fetch(url, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) { if (!d || d.ok !== true || !d.assignments) throw new Error("bad"); return d; });
    }
    var seats = get("/data/schedule.json").catch(function () { return get("/schedule/seats.json"); })
      .then(function (d) { seatData = d; }, function () { seatData = { assignments: [], leave: [] }; });
    var years = fetch("/data/watch/index.json", { cache: "no-cache" }).then(function (r) { return r.json(); })
      .then(function (d) { watchYears = {}; (d.years || []).forEach(function (y) { watchYears[y.year] = y; }); })
      .catch(function () { watchYears = {}; });
    Promise.all([seats, years]).then(function () { var w = seatWait; seatWait = []; w.forEach(function (f) { f(seatData); }); });
  }
  function seatHolder(seat, ymd) {
    var hit = null;
    seatData.assignments.forEach(function (a) {
      if (a[0] === seat && a[2] <= ymd && (!a[3] || a[3] >= ymd)) hit = a[1];
    });
    return hit;
  }
  function onLeave(name, ymd) {
    return seatData.leave.filter(function (l) { return l[0] === name && l[1] <= ymd && l[2] >= ymd; })[0] || null;
  }
  function personLink(name) {
    var p = (HR.people || []).filter(function (x) { return x.name === name; })[0];
    if (!p) return el("span", null, name);
    var a = el("a", null, name);
    a.href = "/hr/?id=" + encodeURIComponent(p.id);
    return a;
  }

  // One day's watch bill: who held each seat, who was on leave and who covered
  // (crew Floater first, or the other watch's holdover, as in Watch_Leave).
  function renderDay(box, y, m, d) {
    var ymd = y + "-" + pad(m + 1) + "-" + pad(d);
    var crew = crewOn(y, m, d);
    var c = central(Date.now());
    var todayYmd = c.y + "-" + pad(c.m + 1) + "-" + pad(c.d);
    box.textContent = "";
    var head = el("div", "day-head");
    head.appendChild(el("b", null, DAYS[new Date(Date.UTC(y, m, d)).getUTCDay()] + " " + pad(d) + " " + MONTHS[m] + " " + y));
    if (ymd <= POSTED_TO) head.appendChild(el("span", "crew-" + crew.toLowerCase(), crew.toUpperCase() + " CREW ON WATCH"));
    box.appendChild(head);
    if (ymd < "1998-04-15") { box.appendChild(el("p", "note", "BEFORE WATCH OPERATIONS BEGAN. NO WATCH BILL ON FILE.")); return; }
    if (ymd > POSTED_TO) { box.appendChild(el("p", "note", "NO WATCH BILL POSTED.")); return; }
    var future = ymd > todayYmd;
    box.appendChild(el("p", "note", future ? "SCHEDULED. STANDING SEAT ASSIGNMENTS AS OF TODAY; LEAVE NOT YET POSTED."
      : "WATCH BILL AS STOOD. DAY WATCH 07:00 - 19:00, NIGHT WATCH 19:00 - 07:00 THE NEXT MORNING."));
    var wait = el("p", "note", "RETRIEVING WATCH BILL...");
    box.appendChild(wait);
    getSeats(function () {
      if (wait.parentNode !== box) return;   // another day was picked meanwhile
      box.removeChild(wait);
      // Cover rule (same as the watch log's Name formula, 2026-11-11): the
      // crew Floater takes the first empty seat of the day (Day Lead ... Night
      // COMM); any other empty seat is overtime from the other crew's holder
      // of that seat; a 24-hour holdover only when neither is possible.
      var floater = seatHolder(crew + " Floater", ymd);
      var out = function (n) { return !n || (!future && !!onLeave(n, ymd)); };
      var floaterFree = floater && !out(floater);
      var SEATS = ["Day Lead", "Day Monitoring", "Day Correlation", "Day COMM", "Night Lead", "Night Monitoring", "Night Correlation", "Night COMM"];
      var firstGap = SEATS.filter(function (s) { return out(seatHolder(crew + " " + s, ymd)); })[0];
      var otherCrew = crew === "Red" ? "Blue" : "Red";
      var floaterBusy = false;
      var t = el("table", "bill day-bill");
      var hr = el("tr");
      ["POSITION", "DAY WATCH 07:00", "NIGHT WATCH 19:00"].forEach(function (h) { hr.appendChild(el("th", null, h)); });
      t.appendChild(hr);
      ["Lead", "Monitoring", "Correlation", "COMM"].forEach(function (role) {
        var tr = el("tr");
        tr.appendChild(el("td", "seat", role.toUpperCase()));
        ["Day", "Night"].forEach(function (watch) {
          var td = el("td");
          var name = seatHolder(crew + " " + watch + " " + role, ymd);
          var lv = name && !future ? onLeave(name, ymd) : null;
          if (name && !lv) {
            td.appendChild(personLink(name));
          } else {
            var cover = null, how = "", why = name ? lv[3].toUpperCase() : "SEAT VACANT";
            var ot = seatHolder(otherCrew + " " + watch + " " + role, ymd);
            var ho = seatHolder(crew + " " + (watch === "Day" ? "Night" : "Day") + " " + role, ymd);
            if (floaterFree && firstGap === watch + " " + role) { cover = floater; floaterBusy = true; how = "CREW RELIEF"; }
            else if (!out(ot)) { cover = ot; how = otherCrew.toUpperCase() + " CREW OVERTIME"; }
            else if (!out(ho)) { cover = ho; how = (watch === "Day" ? "NIGHT" : "DAY") + " WATCH HOLDOVER"; }
            if (cover) td.appendChild(personLink(cover));
            else td.appendChild(el("span", "vacant", "COVERED BY ROTATION"));
            td.appendChild(el("div", "since", (name ? name.toUpperCase() + " // " : "") + why + (cover ? " // " + how : "")));
          }
          tr.appendChild(td);
        });
        t.appendChild(tr);
      });
      var tr = el("tr");
      tr.appendChild(el("td", "seat", "RELIEF"));
      var td = el("td");
      td.colSpan = 2;
      if (!floater) {
        td.appendChild(el("span", "vacant", "VACANT"));
      } else {
        var flv = future ? null : onLeave(floater, ymd);
        td.appendChild(personLink(floater));
        td.appendChild(el("span", "since", flv ? "ON " + flv[3].toUpperCase() : floaterBusy ? "COVERING A SEAT" : "ON CALL, BOTH WATCHES"));
      }
      tr.appendChild(td);
      t.appendChild(tr);
      box.appendChild(t);
      if (!future && ymd <= "2026-09-26" && watchYears && watchYears[String(y)]) {   // the watch log ends 26 Sep 2026 06:16
        var a = el("a", "log-link", "[ OPEN THE WATCH LOG FOR THIS DAY ]");
        a.href = "/watch/?year=" + y + "&date=" + ymd;
        box.appendChild(a);
      }
    });
  }

  function renderRotation(q) {
    var c = central(Date.now());
    var ym = /^(\d{4})-(\d{2})$/.exec(q.month || "");
    var y = ym ? +ym[1] : c.y, m = ym ? +ym[2] - 1 : c.m;
    if (y < 1998 || (y === 1998 && m < 5)) { y = 1998; m = 5; }
    if (y > 2031 || (y === 2031 && m > 6)) { y = 2031; m = 6; }
    var pick = /^(\d{4})-(\d{2})-(\d{2})$/.exec(q.day || "");
    var selDay = pick && +pick[1] === y && +pick[2] - 1 === m ? +pick[3] : (y === c.y && m === c.m ? c.d : 1);
    function monthHref(yy, mm, dd) {
      var dt = new Date(Date.UTC(yy, mm, 1));
      var key = dt.getUTCFullYear() + "-" + pad(dt.getUTCMonth() + 1);
      return "?view=rotation&month=" + key + (dd ? "&day=" + key + "-" + pad(dd) : "");
    }
    function link(dm, label) {
      var a = el("a", null, label);
      a.href = monthHref(y, m + dm);
      a.addEventListener("click", function (e) { e.preventDefault(); go(a.getAttribute("href")); });
      return a;
    }
    pane.appendChild(el("h2", null, "ROTATION"));
    pane.appendChild(el("p", "note", "EACH CREW HOLDS THE FLOOR FROM 07:00 FOR 24 HOURS: DAY WATCH TO 19:00, THEN ITS NIGHT WATCH. TEN-DAY CYCLE SINCE JUNE 1998. SELECT A DAY FOR ITS WATCH BILL."));
    var head = el("div", "cal-head");
    head.appendChild(link(-1, "<< PREV"));
    var mid = el("div", "cal-pick");
    var ms = el("select"), ys = el("select");
    ms.setAttribute("aria-label", "Month");
    ys.setAttribute("aria-label", "Year");
    MONTHS.forEach(function (n, i) { var o = el("option", null, n); o.value = i; ms.appendChild(o); });
    for (var yy = 2031; yy >= 1998; yy--) { var o = el("option", null, String(yy)); o.value = yy; ys.appendChild(o); }
    ms.value = m;
    ys.value = y;
    function jump() { go(monthHref(+ys.value, +ms.value)); }
    ms.addEventListener("change", jump);
    ys.addEventListener("change", jump);
    var now = el("a", null, "TODAY");
    now.href = "?view=rotation";
    now.addEventListener("click", function (e) { e.preventDefault(); go("?view=rotation"); });
    mid.appendChild(ms);
    mid.appendChild(ys);
    mid.appendChild(now);
    head.appendChild(mid);
    head.appendChild(link(1, "NEXT >>"));
    pane.appendChild(head);

    var wrap = el("div", "rot-wrap");
    var t = el("table", "cal");
    var hr = el("tr");
    DAYS.forEach(function (d) { hr.appendChild(el("th", null, d)); });
    t.appendChild(hr);
    var first = new Date(Date.UTC(y, m, 1)).getUTCDay();
    var days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    if (selDay > days) selDay = days;
    var box = el("div", "day-box");
    var tr = el("tr");
    for (var i = 0; i < first; i++) tr.appendChild(el("td", "empty"));
    for (var d = 1; d <= days; d++) {
      (function (d) {
        var crew = crewOn(y, m, d);
        var td = el("td", crew.toLowerCase() + " pickable");
        if (y === c.y && m === c.m && d === c.d) td.className += " today";
        if (d === selDay) td.className += " sel";
        td.tabIndex = 0;
        td.setAttribute("role", "button");
        td.appendChild(el("span", "d", String(d)));
        td.appendChild(el("span", "c crew-" + crew.toLowerCase(), crew.toUpperCase()));
        function choose() {
          Array.prototype.forEach.call(t.querySelectorAll("td.sel"), function (x) { x.classList.remove("sel"); });
          td.classList.add("sel");
          history.replaceState(null, "", monthHref(y, m, d));
          renderDay(box, y, m, d);
          if (window.innerWidth <= 900) box.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        td.addEventListener("click", choose);
        td.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(); } });
        tr.appendChild(td);
      })(d);
      if ((first + d) % 7 === 0) { t.appendChild(tr); tr = el("tr"); }
    }
    if (tr.children.length) {
      while (tr.children.length < 7) tr.appendChild(el("td", "empty"));
      t.appendChild(tr);
    }
    var left = el("div", "rot-cal");
    left.appendChild(t);
    left.appendChild(el("p", "legend", "OUTLINED GREEN: TODAY. WHITE: SELECTED DAY. BEFORE 07:00 THE FLOOR IS STILL HELD BY THE PREVIOUS DAY'S NIGHT WATCH."));
    wrap.appendChild(left);
    wrap.appendChild(box);
    pane.appendChild(wrap);
    renderDay(box, y, m, selDay);
  }

  function params() {
    var q = {};
    location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
      if (!kv) return;
      var p = kv.split("=");
      q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
    });
    return q;
  }
  function go(href) {
    history.pushState(null, "", href);
    render();
    if (window.oerRefreshMenu) window.oerRefreshMenu();
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs a"), function (a) {
    a.addEventListener("click", function (e) { e.preventDefault(); go(a.getAttribute("href")); });
  });
  window.addEventListener("popstate", render);

  function render() {
    var q = params();
    var view = q.view || "now";
    pane.textContent = "";
    Array.prototype.forEach.call(document.querySelectorAll("#tabs a"), function (a) {
      a.classList.toggle("on", a.getAttribute("data-view") === view);
    });
    if (view === "bill") renderBill();
    else if (view === "rotation") renderRotation(q);
    else renderNow();
  }
  render();
})();
</script>
<script src="/assets/notice.js" defer></script>
</body>
</html>
