<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>OER // NODE UNREACHABLE</title>
<!-- Shown by /sw.js in place of any page that can't be loaded (no connection).
     Self-contained: no outside files, because none can be fetched offline. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #33ff66; font-family: "Courier New", Courier, monospace; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .box { border: 2px solid #33ff66; padding: 22px 26px; max-width: 520px; width: 100%; box-sizing: border-box; }
  h1 { font-size: 20px; letter-spacing: 2px; margin: 0 0 14px; color: #ffbf33; }
  p { margin: 8px 0; line-height: 1.5; font-size: 15px; }
  .dim { color: #1f9e3f; font-size: 13px; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  button { margin-top: 14px; background: #000; color: #33ff66; border: 1px solid #33ff66; font: inherit; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #0c2a14; }
  .note { margin-top: 18px; border-top: 1px solid #1f9e3f; padding-top: 10px; color: #1f9e3f; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <h1>NODE UNREACHABLE // RETRYING<span class="blink">_</span></h1>
  <p>NO LINK TO THE PUBLIC ACCESS NODE.</p>
  <p>LAST REQUEST NOT DELIVERED. THE CONSOLE WILL RECONNECT WHEN THE LINE RETURNS.</p>
  <p class="dim" id="status">ATTEMPT 1 // NEXT TRY IN 10 S</p>
  <button type="button" id="retry">[ RETRY NOW ]</button>
  <div class="note">NO DATA IS SHOWN WHILE THE NODE IS UNREACHABLE. INDEPENDENT CREATIVE PROJECT. NOT AN OFFICIAL ALERT OR EMERGENCY SERVICE.</div>
</div>
<script>
(function () {
  var attempt = 1, wait = 10, left = wait;
  var status = document.getElementById("status");
  function show() { status.textContent = "ATTEMPT " + attempt + " // NEXT TRY IN " + left + " S"; }
  function tryNow() {
    status.textContent = "ATTEMPT " + attempt + " // CHECKING LINE...";
    fetch("/robots.txt?ping=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (r.ok) location.reload(); else throw new Error("down"); })
      .catch(function () { attempt++; wait = Math.min(wait * 2, 60); left = wait; show(); });
  }
  setInterval(function () { if (left > 0) { left--; if (left === 0) tryNow(); else show(); } }, 1000);
  document.getElementById("retry").addEventListener("click", function () { left = 0; tryNow(); });
  window.addEventListener("online", function () { left = 0; tryNow(); });
})();
</script>
</body>
</html>
