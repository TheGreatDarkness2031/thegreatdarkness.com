<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Great Darkness</title>
  <meta name="robots" content="noindex">
  <style>
    html, body { height: 100%; margin: 0; background: #000000; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
      color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
    }
    .panel {
      width: 96%;
      max-width: 520px;
      padding: 18px 10px;
      border: 2px solid #5a1717;
      box-shadow: 5px 5px 0 #250505;
    }
    .label {
      display: inline-block;
      padding: 3px 6px;
      border: 1px solid #5a1717;
      color: #b77878;
      font-size: 0.7rem;
      letter-spacing: 1.2px;
    }
    .line {
      margin: 16px 0;
      color: #aaaaaa;
      font-size: 0.85rem;
      letter-spacing: 3px;
    }
    a {
      color: #cccccc;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-decoration: none;
      border: 1px solid #5a1717;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="label">[ RECORD NOT FOUND ]</div>
    <div class="line">NO ENTRY EXISTS AT THIS ADDRESS.</div>
    <a href="/">RETURN</a>
  </div>
</body>
</html>
