<body>

<p>[ <a href="/watch/">Graphical version</a> | <a href="/home/">Home</a> | <a href="/events/text/">Events (text)</a> ]</p>

<h1>OER Watch Log Archive</h1>
<p><b>Text-only version.</b> <span id="years"></span></p>
<hr>

<p id="status">Retrieving watch log...</p>
<dl id="records"></dl>
<p id="pages"></p>

<hr>
<address>Operational Event Register // Public Access Node GDK-001</address>

<script>
  var PAGE_SIZE = 50;
  var params = new URLSearchParams(location.search);
  var year = /^\d{4}$/.test(params.get("year") || "") ? params.get("year") : "";
  var page = Math.max(1, parseInt(params.get("page"), 10) || 1);

  function link(text, y, p) {
    var a = document.createElement("a");
    a.href = "?year=" + encodeURIComponent(y) + (p > 1 ? "&page=" + p : "");
    a.textContent = text;
    return a;
  }

  google.script.run
    .withSuccessHandler(function (data) {
      if (!data || !data.success) {
        document.getElementById("status").textContent = (data && data.message) || "The watch log is not available.";
        return;
      }
      var shown = data.selectedYear;
      var years = document.getElementById("years");
      years.appendChild(document.createTextNode("Year: "));
      (data.years || []).forEach(function (y, i) {
        if (i) years.appendChild(document.createTextNode(" | "));
        if (String(y.year) === String(shown)) {
          var b = document.createElement("b");
          b.textContent = y.year;
          years.appendChild(b);
        } else {
          years.appendChild(link(y.year, y.year, 1));
        }
      });

      document.getElementById("status").textContent =
        shown + ": " + data.totalMatching + " records. Page " + data.page + " of " + data.totalPages + ".";

      var dl = document.getElementById("records");
      (data.records || []).forEach(function (r) {
        var dt = document.createElement("dt");
        dt.textContent = [r.recordId, r.timestampLocal, r.responsibleRole, r.entryType, (r.condition || "") + "/" + (r.priority || ""), r.systemArea, r.relatedReference]
          .filter(function (v) { return v && v !== "/"; }).join(" | ");
        var dd = document.createElement("dd");
        dd.textContent = r.logEntry || "";
        dl.appendChild(dt);
        dl.appendChild(dd);
        if (r.followUpOrDisposition) {
          var f = document.createElement("dd");
          f.textContent = "Follow-up: " + r.followUpOrDisposition;
          dl.appendChild(f);
        }
      });

      var pages = document.getElementById("pages");
      if (data.hasPrevious) pages.appendChild(link("<< Previous page", shown, data.page - 1));
      if (data.hasPrevious && data.hasNext) pages.appendChild(document.createTextNode(" | "));
      if (data.hasNext) pages.appendChild(link("Next page >>", shown, data.page + 1));
    })
    .withFailureHandler(function () {
      document.getElementById("status").textContent = "The watch log is not responding. Please try again later.";
    })
    .getWatchLogPage({ year: year, page: page, pageSize: PAGE_SIZE });
</script>

<script src="/assets/notice.js" defer></script>
