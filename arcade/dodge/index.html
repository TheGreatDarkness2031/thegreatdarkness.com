<!-- ==========================================================

<div class="shared-leaderboard">

  <div class="shared-leaderboard-title">

<script>

  /* ==========================================================
     LOAD LEADERBOARD

     focusRank:
       null / undefined = start at #1
       number = center that rank in the window
     ========================================================== */

  function loadLeaderboard(
    gameName,
    focusRank
  ) {

    const boards =
      document.querySelectorAll(
        ".shared-leaderboard"
      );


    if (!boards.length) {

      console.error(
        "Shared leaderboard element not found."
      );

      return;

    }


    boards.forEach(
      function(board) {

        const leaderboard =
          board.querySelector(
            ".shared-leaderboard-scores"
          );


        if (!leaderboard) {

          return;

        }


        /*
         * Every normal leaderboard load starts
         * at the top unless a specific rank was
         * supplied.
         */

        leaderboard.scrollTop = 0;


        if (!gameName) {

          leaderboard.innerHTML =
            '<div class="shared-empty-score">' +
            'LEADERBOARD UNAVAILABLE' +
            '</div>';

          return;

        }


        leaderboard.innerHTML =
          '<div class="shared-empty-score">' +
          'LOADING...' +
          '</div>';


        google.script.run

          .withSuccessHandler(
            function(scores) {

              leaderboard.innerHTML = "";


              if (
                !scores ||
                scores.length === 0
              ) {

                leaderboard.innerHTML =
                  '<div class="shared-empty-score">' +
                  'NO SCORES YET' +
                  '</div>';

                return;

              }


              /* ------------------------------------------------
                 UPDATE TITLE USING ACTUAL SCORE COUNT
                 ------------------------------------------------ */

              const title =
                board.querySelector(
                  ".shared-leaderboard-title"
                );


              if (title) {

                title.textContent =
                  "[ TOP " +
                  scores.length +
                  " ]";

              }


              /* ------------------------------------------------
                 BUILD SCORE ROWS
                 ------------------------------------------------ */

              scores.forEach(
                function(entry, index) {

                  const row =
                    document.createElement(
                      "div"
                    );

                  row.className =
                    "shared-score-row";


                  /*
                   * Store the actual rank on the row.
                   * This lets us find the player's row
                   * after the leaderboard has rendered.
                   */

                  row.dataset.rank =
                    String(index + 1);


                  const rank =
                    document.createElement(
                      "div"
                    );

                  rank.className =
                    "shared-score-rank";

                  rank.textContent =
                    (index + 1) + ".";


                  const name =
                    document.createElement(
                      "div"
                    );

                  name.className =
                    "shared-score-name";

                  name.textContent =
                    entry.name || "";


                  const value =
                    document.createElement(
                      "div"
                    );

                  value.className =
                    "shared-score-value";

                  value.textContent =
                    entry.score !== undefined &&
                    entry.score !== null
                      ? entry.score
                      : "";


                  row.appendChild(rank);

                  row.appendChild(name);

                  row.appendChild(value);

                  leaderboard.appendChild(row);

                }
              );


              /* ------------------------------------------------
                 POSITION LEADERBOARD

                 No focusRank:
                   Start at #1.

                 focusRank:
                   Put that player's row approximately
                   in the center of the visible window.
                 ------------------------------------------------ */

              setTimeout(
                function() {

                  if (
                    focusRank === undefined ||
                    focusRank === null ||
                    !Number.isFinite(
                      Number(focusRank)
                    )
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRank =
                    Math.floor(
                      Number(focusRank)
                    );


                  if (
                    targetRank < 1
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRow =
                    leaderboard.querySelector(
                      '[data-rank="' +
                      targetRank +
                      '"]'
                    );


                  if (!targetRow) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const rowCenter =
                    targetRow.offsetTop +
                    (
                      targetRow.offsetHeight /
                      2
                    );


                  const windowCenter =
                    leaderboard.clientHeight /
                    2;


                  let targetScroll =
                    rowCenter -
                    windowCenter;


                  const maxScroll =
                    leaderboard.scrollHeight -
                    leaderboard.clientHeight;


                  targetScroll =
                    Math.max(
                      0,
                      Math.min(
                        targetScroll,
                        maxScroll
                      )
                    );


                  leaderboard.scrollTop =
                    targetScroll;

                },
                50
              );

            }
          )

          .withFailureHandler(
            function(error) {

              console.error(
                "Leaderboard error:",
                error
              );


              leaderboard.innerHTML =
                '<div class="shared-empty-score">' +
                'LEADERBOARD UNAVAILABLE' +
                '</div>';

            }
          )

          // Every kept score (Config hall_of_fame_count).
          .getGameBoardScores(
            gameName
          );

      }
    );

  }

<script>

     HIGH SCORE STATE
     ========================================================== */

  let highScoreGameName = "";

  let highScorePending = false;

  let highScoreNameLength = 20;

    document.getElementById("highScoreScreen");

  const highScoreNumber =
    document.getElementById("highScoreNumber");

  const nameInput =
    document.getElementById("highScoreNameInput");

  const submitScoreButton =
    document.getElementById("submitScoreButton");

  const submitMessage =
    document.getElementById("submitMessage");


  /* ==========================================================
     LOAD NAME LENGTH CONFIGURATION
     ========================================================== */

  function loadHighScoreNameLength() {

    google.script.run

      .withSuccessHandler(function(length) {

        length =
          Number(length);

        if (
          !Number.isFinite(length) ||
          length < 1
        ) {

          length = 20;

        }

        highScoreNameLength =
          Math.floor(length);

        nameInput.maxLength =
          highScoreNameLength;

      })

      .withFailureHandler(function(error) {

        console.error(
          "Could not load score name length:",
          error
        );

        highScoreNameLength = 20;

        nameInput.maxLength = 20;

      })

      .getHighScoreNameLength();

  }


  /* ==========================================================
     RETURN CALLBACK
     ========================================================== */

  function setHighScoreReturnCallback(callback) {

    highScoreReturnCallback = callback;

  }


  /* ==========================================================
     SHOW HIGH SCORE SCREEN
     ========================================================== */

  function showHighScoreScreen(gameName, score) {

    if (!gameName) return;


    highScoreGameName = gameName;

    highScoreValue =
      Number(score) || 0;

    highScorePending = true;

    highScoreSubmitting = false;


    highScoreNumber.textContent =
      "SCORE: " + highScoreValue;


    nameInput.value = "";

    submitMessage.textContent = "";

    submitScoreButton.disabled = false;

    submitScoreButton.textContent = "SUBMIT";


    /*
     * IMPORTANT:
     * This is a real full-screen layer.
     * It is NOT part of the normal game layout.
     */

    highScoreScreen.style.display = "flex";


    setTimeout(function() {

      nameInput.focus();

    }, 100);

  }


  /* ==========================================================
     HIDE HIGH SCORE SCREEN
     ========================================================== */

  function hideHighScoreScreen() {

    highScorePending = false;

    highScoreSubmitting = false;

    highScoreScreen.style.display = "none";

  }


  /* ==========================================================
     SUBMIT HIGH SCORE
     ========================================================== */

  function submitHighScore() {

    if (
      !highScorePending ||
      highScoreSubmitting
    ) {
      return;
    }


    let playerName =
      nameInput.value
        .trim()
        .toUpperCase()
        .replace(/:/g, "")
        .substring(
          0,
          highScoreNameLength
        );


    if (!playerName) {

      submitMessage.textContent =
        "ENTER A NAME FIRST.";

      nameInput.focus();

      return;

    }


    highScoreSubmitting = true;

    submitScoreButton.disabled = true;

    submitScoreButton.textContent =
      "SAVING...";

    submitMessage.textContent =
      "SUBMITTING SCORE...";


    google.script.run

      /*
       * IMPORTANT:
       *
       * submitHighScore() returns:
       *
       * {
       *   success: true,
       *   rank: 64,
       *   scores: [...]
       * }
       *
       * We pass that result to the game's
       * return callback.
       */

      .withSuccessHandler(function(result) {

        highScorePending = false;

        highScoreSubmitting = false;

        submitMessage.textContent =
          "SCORE SAVED.";

        submitScoreButton.textContent =
          "SAVED";


        setTimeout(function() {

          hideHighScoreScreen();


          if (
            typeof highScoreReturnCallback ===
            "function"
          ) {

            /*
             * Pass the submission result,
             * including the player's rank.
             */

            highScoreReturnCallback(
              result
            );

          }

        }, 700);

      })

      .withFailureHandler(function(error) {

        highScoreSubmitting = false;

        submitScoreButton.disabled = false;

        submitScoreButton.textContent =
          "SUBMIT";

        submitMessage.textContent =
          "ERROR SAVING SCORE. TRY AGAIN.";

        console.error(error);

      })

      .submitHighScore(
        highScoreGameName,
        highScoreValue,
        playerName
      );

  }


  /* ==========================================================
     BUTTON
     ========================================================== */

  submitScoreButton.addEventListener(
    "click",
    submitHighScore
  );

  // SKIP: no name, no save; back to the game's start screen.
  document.getElementById("skipScoreButton").addEventListener(
    "click",
    function() {
      if (highScoreSubmitting) return;
      location.reload();
    }
  );


  /* ==========================================================
     ENTER KEY
     ========================================================== */

  nameInput.addEventListener(
    "keydown",
    function(event) {

      event.stopPropagation();


      if (event.key === "Enter") {

        event.preventDefault();

        submitHighScore();

      }

    }
  );


  /* ==========================================================
     NAME INPUT
     ========================================================== */

  nameInput.addEventListener(
    "input",
    function() {

      this.value =
        this.value
          .toUpperCase()
          .replace(/:/g, "")
          .substring(
            0,
            highScoreNameLength
          );

    }
  );


  /* ==========================================================
     INITIALIZE
     ========================================================== */

  loadHighScoreNameLength();

</script>

<script>


// ==========================================
// GAME CONSTANTS
// ==========================================

const GAME_NAME =
  "DarknessDodge";

const BASE_WIDTH =
  500;

const BASE_HEIGHT =
  600;


// ==========================================
// ELEMENTS
// ==========================================

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");


const startScreen =
  document.getElementById("startScreen");


const gameScreen =
  document.getElementById("gameScreen");


const gameOverScreen =
  document.getElementById("gameOverScreen");


const startButton =
  document.getElementById("startButton");


const leftButton =
  document.getElementById("leftButton");


const rightButton =
  document.getElementById("rightButton");


const gameOverTitle =
  document.getElementById("gameOverTitle");


const gameOverScore =
  document.getElementById("gameOverScore");


const playAgainButton =
  document.getElementById("playAgainButton");


// ==========================================
// GAME STATE
// ==========================================

let gameStarted =
  false;


let gameOver =
  false;


let score =
  0;


let lastFrame =
  0;


let spawnTimer =
  0;


let difficultyTimer =
  0;


let objectSpeed =
  3;


let spawnRate =
  700;


let objects =
  [];


// ==========================================
// LOCAL DISPLAY HIGH SCORE
// ==========================================

let highScore =
  parseInt(
    localStorage.getItem(
      "greatDarknessDodgeHigh"
    )
  ) || 0;


// ==========================================
// PLAYER
// ==========================================

const player = {

  x: 230,

  y: 545,

  width: 40,

  height: 40,

  speed: 10

};


let movingLeft =
  false;


let movingRight =
  false;


// ==========================================
// STATS
// ==========================================

function updateStats() {

  document.getElementById(
    "score"
  ).textContent =
    "SCORE: " + score;


  document.getElementById(
    "highScore"
  ).textContent =
    "HIGH: " + highScore;

}


// ==========================================
// RESET GAME STATE
// ==========================================

function resetGameState() {

  gameStarted =
    false;

  gameOver =
    false;

  score =
    0;

  objects =
    [];

  objectSpeed =
    3;

  spawnRate =
    700;

  spawnTimer =
    0;

  difficultyTimer =
    0;

  lastFrame =
    0;


  player.x =
    BASE_WIDTH / 2 -
    player.width / 2;

  player.y =
    545;


  movingLeft =
    false;

  movingRight =
    false;


  updateStats();

}


// ==========================================
// START GAME
// ==========================================

function startGame() {

  resetGameState();

  gameStarted =
    true;


  startScreen.style.display =
    "none";

  gameOverScreen.style.display =
    "none";


  hideHighScoreScreen();


  gameScreen.style.display =
    "block";


  lastFrame =
    0;

}


// ==========================================
// RESTART GAME
// ==========================================

function restartGame() {

  startGame();

}


// ==========================================
// SPAWN OBJECT
// ==========================================

function spawnObject() {

  const size =
    15 +
    Math.floor(
      Math.random() * 25
    );


  const x =
    Math.random() *
    (BASE_WIDTH - size);


  const speed =
    objectSpeed *
    (
      0.75 +
      Math.random() * 0.7
    );


  objects.push({

    x: x,

    y: -size,

    width: size,

    height: size,

    speed: speed,

    rotation:
      Math.random() * Math.PI,

    rotationSpeed:
      (Math.random() - 0.5) * 0.08

  });

}


// ==========================================
// PLAYER MOVEMENT
// ==========================================

function updatePlayer() {

  if (movingLeft) {

    player.x -=
      player.speed;

  }


  if (movingRight) {

    player.x +=
      player.speed;

  }


  player.x =
    Math.max(
      0,
      Math.min(
        BASE_WIDTH -
        player.width,
        player.x
      )
    );

}


// ==========================================
// COLLISION
// ==========================================

function checkCollision(
  a,
  b
) {

  return (

    a.x <
      b.x + b.width &&

    a.x + a.width >
      b.x &&

    a.y <
      b.y + b.height &&

    a.y + a.height >
      b.y

  );

}


// ==========================================
// UPDATE OBJECTS
// ==========================================

function updateObjects() {

  for (
    let i = objects.length - 1;
    i >= 0;
    i--
  ) {

    const obj =
      objects[i];


    obj.y +=
      obj.speed;


    obj.rotation +=
      obj.rotationSpeed;


    if (
      checkCollision(
        player,
        obj
      )
    ) {

      endGame();

      return;

    }


    if (
      obj.y >
      BASE_HEIGHT + 50
    ) {

      objects.splice(
        i,
        1
      );

    }

  }

}


// ==========================================
// DIFFICULTY
// ==========================================

function updateDifficulty(
  delta
) {

  difficultyTimer +=
    delta;


  if (
    difficultyTimer >= 1000
  ) {

    difficultyTimer -=
      1000;


    score++;


    objectSpeed =
      Math.min(
        9,
        objectSpeed + 0.08
      );


    spawnRate =
      Math.max(
        220,
        spawnRate - 12
      );


    updateStats();

  }

}


// ==========================================
// END GAME
// ==========================================

function endGame() {

  if (gameOver) {

    return;

  }


  gameOver =
    true;

  gameStarted =
    false;

  movingLeft =
    false;

  movingRight =
    false;


  if (
    score > highScore
  ) {

    highScore =
      score;


    localStorage.setItem(
      "greatDarknessDodgeHigh",
      highScore
    );

  }


  updateStats();


  checkScoreQualification();

}


// ==========================================
// HIGH SCORE QUALIFICATION
// ==========================================

function checkScoreQualification() {

  google.script.run

    .withSuccessHandler(
      function(qualifies) {

        if (qualifies) {

          gameScreen.style.display =
            "none";

          gameOverScreen.style.display =
            "none";

          startScreen.style.display =
            "none";


          setHighScoreReturnCallback(
            function(result) {

              showStartScreen(
                result &&
                result.rank
              );

            }
          );


          showHighScoreScreen(
            GAME_NAME,
            score
          );

        } else {

          showNormalGameOver();

        }

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          "High score qualification failed:",
          error
        );


        showNormalGameOver();

      }
    )

    .qualifiesForHighScore(
      GAME_NAME,
      score
    );

}


// ==========================================
// NORMAL GAME OVER
// ==========================================

function showNormalGameOver() {

  gameStarted =
    false;

  gameOver =
    true;

  movingLeft =
    false;

  movingRight =
    false;


  gameOverTitle.textContent =
    "YOU WERE CONSUMED";


  gameOverScore.textContent =
    "SCORE: " + score;


  startScreen.style.display =
    "none";

  gameScreen.style.display =
    "none";

  gameOverScreen.style.display =
    "block";


  hideHighScoreScreen();

}


// ==========================================
// SHOW START SCREEN
// ==========================================

function showStartScreen(
  focusRank
) {

  gameStarted =
    false;

  gameOver =
    false;

  movingLeft =
    false;

  movingRight =
    false;


  startScreen.style.display =
    "block";

  gameScreen.style.display =
    "none";

  gameOverScreen.style.display =
    "none";


  hideHighScoreScreen();


  loadLeaderboard(
    GAME_NAME,
    focusRank
  );

}


// ==========================================
// BACKGROUND
// ==========================================

function drawBackground() {

  ctx.fillStyle =
    "#030303";


  ctx.fillRect(
    0,
    0,
    BASE_WIDTH,
    BASE_HEIGHT
  );


  ctx.fillStyle =
    "#0b0b0b";


  for (
    let y = 0;
    y < BASE_HEIGHT;
    y += 10
  ) {

    ctx.fillRect(
      0,
      y,
      BASE_WIDTH,
      1
    );

  }


  ctx.fillStyle =
    "#181818";


  for (
    let i = 0;
    i < 40;
    i++
  ) {

    const x =
      (i * 97) %
      BASE_WIDTH;


    const y =
      (i * 53) %
      BASE_HEIGHT;


    ctx.fillRect(
      x,
      y,
      2,
      2
    );

  }

}


// ==========================================
// PLAYER DRAW
// ==========================================

function drawPlayer() {

  ctx.fillStyle =
    "#00ff00";


  ctx.fillRect(
    player.x,
    player.y + 8,
    player.width,
    player.height - 8
  );


  ctx.fillRect(
    player.x + 5,
    player.y,
    player.width - 10,
    18
  );


  ctx.fillStyle =
    "#000000";


  ctx.fillRect(
    player.x + 10,
    player.y + 5,
    5,
    5
  );


  ctx.fillRect(
    player.x + 25,
    player.y + 5,
    5,
    5
  );


  ctx.fillStyle =
    "#00ff00";


  ctx.fillRect(
    player.x + 5,
    player.y + 32,
    8,
    8
  );


  ctx.fillRect(
    player.x + 27,
    player.y + 32,
    8,
    8
  );


  ctx.fillRect(
    player.x + 18,
    player.y - 7,
    4,
    7
  );

}


// ==========================================
// FALLING OBJECT
// ==========================================

function drawObject(
  obj
) {

  ctx.save();


  ctx.translate(
    obj.x + obj.width / 2,
    obj.y + obj.height / 2
  );


  ctx.rotate(
    obj.rotation
  );


  ctx.fillStyle =
    "#ff0000";


  ctx.fillRect(
    -obj.width / 2,
    -obj.height / 2,
    obj.width,
    obj.height
  );


  ctx.fillStyle =
    "#ffff00";


  ctx.fillRect(
    -obj.width / 4,
    -obj.height / 4,
    obj.width / 2,
    obj.height / 2
  );


  ctx.restore();

}


// ==========================================
// UPDATE
// ==========================================

function update(
  timestamp
) {

  if (
    !gameStarted ||
    gameOver ||
    highScorePending
  ) {

    return;

  }


  if (!lastFrame) {

    lastFrame =
      timestamp;

  }


  const delta =
    timestamp -
    lastFrame;


  lastFrame =
    timestamp;


  updatePlayer();


  spawnTimer +=
    delta;


  if (
    spawnTimer >= spawnRate
  ) {

    spawnTimer =
      0;


    spawnObject();


    if (
      score > 15 &&
      Math.random() < 0.18
    ) {

      spawnObject();

    }

  }


  updateObjects();


  updateDifficulty(
    delta
  );

}


// ==========================================
// DRAW
// ==========================================

function draw() {

  ctx.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.save();


  /*
   * Canvas stays internally at 500x600.
   * CSS handles the visual scaling.
   */

  drawBackground();


  for (
    let i = 0;
    i < objects.length;
    i++
  ) {

    drawObject(
      objects[i]
    );

  }


  drawPlayer();


  ctx.restore();

}


// ==========================================
// MAIN LOOP
// ==========================================

function gameLoop(
  timestamp
) {

  update(
    timestamp
  );


  draw();


  requestAnimationFrame(
    gameLoop
  );

}


// ==========================================
// KEYBOARD
// ==========================================

document.addEventListener(
  "keydown",
  function(event) {

    if (highScorePending) {

      return;

    }


    const target =
      event.target;


    if (
      target &&
      (
        target.tagName === "INPUT" ||
        target.tagName === "TEXTAREA" ||
        target.tagName === "SELECT" ||
        target.isContentEditable
      )
    ) {

      return;

    }


    const key =
      event.key.toLowerCase();


    if (
      key === "arrowleft" ||
      key === "a"
    ) {

      event.preventDefault();

      movingLeft =
        true;

    }


    if (
      key === "arrowright" ||
      key === "d"
    ) {

      event.preventDefault();

      movingRight =
        true;

    }


    if (
      gameOver &&
      (
        key === "enter" ||
        key === " "
      )
    ) {

      event.preventDefault();

      restartGame();

    }

  }
);


document.addEventListener(
  "keyup",
  function(event) {

    if (highScorePending) {

      return;

    }


    const key =
      event.key.toLowerCase();


    if (
      key === "arrowleft" ||
      key === "a"
    ) {

      movingLeft =
        false;

    }


    if (
      key === "arrowright" ||
      key === "d"
    ) {

      movingRight =
        false;

    }

  }
);


// ==========================================
// MOBILE BUTTONS
// ==========================================

function holdButton(
  button,
  onStart,
  onEnd
) {

  button.addEventListener(
    "pointerdown",
    function(event) {

      event.preventDefault();

      event.stopPropagation();


      try {

        button.setPointerCapture(
          event.pointerId
        );

      } catch (e) {}


      onStart();

    }
  );


  button.addEventListener(
    "pointerup",
    function(event) {

      event.preventDefault();

      event.stopPropagation();

      onEnd();

    }
  );


  button.addEventListener(
    "pointercancel",
    function(event) {

      event.preventDefault();

      event.stopPropagation();

      onEnd();

    }
  );


  button.addEventListener(
    "lostpointercapture",
    function() {

      onEnd();

    }
  );


  button.addEventListener(
    "contextmenu",
    function(event) {

      event.preventDefault();

    }
  );


  button.addEventListener(
    "selectstart",
    function(event) {

      event.preventDefault();

    }
  );


  button.addEventListener(
    "dragstart",
    function(event) {

      event.preventDefault();

    }
  );

}


holdButton(

  leftButton,

  function() {

    if (highScorePending) {

      return;

    }


    if (gameOver) {

      restartGame();

    } else if (!gameStarted) {

      startGame();

    }


    movingLeft =
      true;

  },

  function() {

    movingLeft =
      false;

  }

);


holdButton(

  rightButton,

  function() {

    if (highScorePending) {

      return;

    }


    if (gameOver) {

      restartGame();

    } else if (!gameStarted) {

      startGame();

    }


    movingRight =
      true;

  },

  function() {

    movingRight =
      false;

  }

);


// ==========================================
// TAP CANVAS
// ==========================================

canvas.addEventListener(
  "pointerdown",
  function(event) {

    event.preventDefault();


    if (highScorePending) {

      return;

    }


    if (gameOver) {

      restartGame();

      return;

    }


    if (!gameStarted) {

      startGame();

    }

  }
);


// ==========================================
// START BUTTON
// ==========================================

startButton.addEventListener(
  "click",
  startGame
);


// ==========================================
// PLAY AGAIN
// ==========================================

playAgainButton.addEventListener(
  "click",
  restartGame
);


// ==========================================
// INITIALIZE
// ==========================================

setHighScoreReturnCallback(
  function() {

    showStartScreen();

  }
);


resetGameState();

showStartScreen();

requestAnimationFrame(
  gameLoop
);

</script>

  }

  /* Short windows (phones held sideways): a tighter start screen. */
  @media (max-height: 450px) {

    .play-again-button,
    .difficulty-button,
    .back-button {
      padding-top: 8px !important;
      padding-bottom: 8px !important;
      margin-top: 4px !important;
      margin-bottom: 4px !important;
    }

    .difficulty-label {
      margin: 2px 0 !important;
    }
  }
</style>
<script>
  (function() {

    var MIN_HEIGHT = 140;
    var SLACK = 6;

    function gameCanvas() {
      return document.querySelector("canvas");
    }

    function shown(el) {
      return !!el && el.offsetParent !== null;
    }

    // Lowest point of everything on the page except the canvas,
    // ignoring overlays (fixed / absolute) and hidden elements.
    // Overlays are skipped together with everything inside them.
    function contentBottom(skip) {
      var bottom = 0;

      function walk(parent) {
        var kids = parent.children;

        for (var i = 0; i !== kids.length; i++) {
          var el = kids[i];

          if (el === skip) {
            continue;
          }

          var cs = getComputedStyle(el);

          if (
            cs.display === "none" ||
            cs.position === "fixed" ||
            cs.position === "absolute"
          ) {
            continue;
          }

          var r = el.getBoundingClientRect();

          if (r.width !== 0 || r.height !== 0) {
            var b = r.bottom + (parseFloat(cs.marginBottom) || 0);

            if (b > bottom) {
              bottom = b;
            }
          }

          walk(el);
        }
      }

      walk(document.body);

      return bottom + window.scrollY;
    }

    // Start screen: the leaderboard list already scrolls inside its
    // own box; shrink that box so START stays on screen.
    var LIST_MIN_HEIGHT = 140;
    var LIST_MIN_HEIGHT_SHORT = 80;   // windows under 450 px tall

    function fitList() {
      var list = document.querySelector(".shared-leaderboard-scores");

      if (!shown(list)) {
        return;
      }

      list.style.height = "";

      var over =
        document.documentElement.scrollHeight - window.innerHeight;

      if (over > 0) {
        var current = list.getBoundingClientRect().height;
        list.style.height =
          Math.max(
            window.innerHeight >= 450 ? LIST_MIN_HEIGHT : LIST_MIN_HEIGHT_SHORT,
            Math.floor(current - over - SLACK)
          ) + "px";
      }
    }

    function fit() {
      fitList();

      var canvas = gameCanvas();

      if (!shown(canvas) || !canvas.width) {
        return;
      }

      canvas.style.width = "";
      canvas.style.height = "";

      var natural = canvas.getBoundingClientRect();
      var ratio = canvas.height / canvas.width;

      // Measure everything else with the canvas collapsed.
      canvas.style.height = "0px";
      var other = contentBottom(canvas);
      canvas.style.height = "";

      var available = window.innerHeight - other - SLACK;
      var naturalHeight = natural.width * ratio;

      var h = naturalHeight;

      if (naturalHeight > available) {
        h = Math.max(MIN_HEIGHT, Math.floor(available));
        setHeight(canvas, h, ratio);
      }

      // Padding and margins the measurement can't see: trim by
      // whatever still overflows (two passes at most).
      for (var pass = 0; pass !== 2; pass++) {
        var over =
          document.documentElement.scrollHeight - window.innerHeight;

        if (over > 0 && h > MIN_HEIGHT) {
          h = Math.max(MIN_HEIGHT, Math.floor(h - over - 1));
          setHeight(canvas, h, ratio);
        }
      }
    }

    function setHeight(canvas, h, ratio) {
      canvas.style.height = h + "px";
      canvas.style.width = Math.floor(h / ratio) + "px";
    }

    var timer = 0;

    function later() {
      clearTimeout(timer);
      timer = setTimeout(fit, 60);
    }

    window.tgdFitGame = fit;

    window.addEventListener("resize", later);
    window.addEventListener("orientationchange", later);
    document.addEventListener("click", later, true);
    document.addEventListener("keyup", later, true);

    // Screens change without a resize (START, game over): refit when
    // the canvas appears or the window size changes.
    var lastSignature = "";

    setInterval(function() {
      var canvas = gameCanvas();
      var signature =
        window.innerWidth + "x" + window.innerHeight + ":" +
        (shown(canvas) ? "on" : "off") + ":" +
        (shown(document.querySelector(".shared-leaderboard-scores")) ? "list" : "") + ":" +
        (canvas ? canvas.width + "x" + canvas.height : "");

      if (signature !== lastSignature) {
        lastSignature = signature;
        fit();
      }
    }, 400);

    fit();
  })();
</script>
