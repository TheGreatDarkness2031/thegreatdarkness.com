<script>

  /* ==========================================================
     LOAD LEADERBOARD

     focusRank:
       null / undefined = start at #1
       number = center that rank in the window
     ========================================================== */

  function loadLeaderboard(
    gameName,
    focusRank
  ) {

    const boards =
      document.querySelectorAll(
        ".shared-leaderboard"
      );


    if (!boards.length) {

      console.error(
        "Shared leaderboard element not found."
      );

      return;

    }


    boards.forEach(
      function(board) {

        const leaderboard =
          board.querySelector(
            ".shared-leaderboard-scores"
          );


        if (!leaderboard) {

          return;

        }


        /*
         * Every normal leaderboard load starts
         * at the top unless a specific rank was
         * supplied.
         */

        leaderboard.scrollTop = 0;


        if (!gameName) {

          leaderboard.innerHTML =
            '<div class="shared-empty-score">' +
            'LEADERBOARD UNAVAILABLE' +
            '</div>';

          return;

        }


        leaderboard.innerHTML =
          '<div class="shared-empty-score">' +
          'LOADING...' +
          '</div>';


        google.script.run

          .withSuccessHandler(
            function(scores) {

              leaderboard.innerHTML = "";


              if (
                !scores ||
                scores.length === 0
              ) {

                leaderboard.innerHTML =
                  '<div class="shared-empty-score">' +
                  'NO SCORES YET' +
                  '</div>';

                return;

              }


              /* ------------------------------------------------
                 UPDATE TITLE USING ACTUAL SCORE COUNT
                 ------------------------------------------------ */

              const title =
                board.querySelector(
                  ".shared-leaderboard-title"
                );


              if (title) {

                title.textContent =
                  "[ TOP " +
                  scores.length +
                  " ]";

              }


              /* ------------------------------------------------
                 BUILD SCORE ROWS
                 ------------------------------------------------ */

              scores.forEach(
                function(entry, index) {

                  const row =
                    document.createElement(
                      "div"
                    );

                  row.className =
                    "shared-score-row";


                  /*
                   * Store the actual rank on the row.
                   * This lets us find the player's row
                   * after the leaderboard has rendered.
                   */

                  row.dataset.rank =
                    String(index + 1);


                  const rank =
                    document.createElement(
                      "div"
                    );

                  rank.className =
                    "shared-score-rank";

                  rank.textContent =
                    (index + 1) + ".";


                  const name =
                    document.createElement(
                      "div"
                    );

                  name.className =
                    "shared-score-name";

                  name.textContent =
                    entry.name || "";


                  const value =
                    document.createElement(
                      "div"
                    );

                  value.className =
                    "shared-score-value";

                  value.textContent =
                    entry.score !== undefined &&
                    entry.score !== null
                      ? entry.score
                      : "";


                  row.appendChild(rank);

                  row.appendChild(name);

                  row.appendChild(value);

                  leaderboard.appendChild(row);

                }
              );


              /* ------------------------------------------------
                 POSITION LEADERBOARD

                 No focusRank:
                   Start at #1.

                 focusRank:
                   Put that player's row approximately
                   in the center of the visible window.
                 ------------------------------------------------ */

              setTimeout(
                function() {

                  if (
                    focusRank === undefined ||
                    focusRank === null ||
                    !Number.isFinite(
                      Number(focusRank)
                    )
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRank =
                    Math.floor(
                      Number(focusRank)
                    );


                  if (
                    targetRank < 1
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRow =
                    leaderboard.querySelector(
                      '[data-rank="' +
                      targetRank +
                      '"]'
                    );


                  if (!targetRow) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const rowCenter =
                    targetRow.offsetTop +
                    (
                      targetRow.offsetHeight /
                      2
                    );


                  const windowCenter =
                    leaderboard.clientHeight /
                    2;


                  let targetScroll =
                    rowCenter -
                    windowCenter;


                  const maxScroll =
                    leaderboard.scrollHeight -
                    leaderboard.clientHeight;


                  targetScroll =
                    Math.max(
                      0,
                      Math.min(
                        targetScroll,
                        maxScroll
                      )
                    );


                  leaderboard.scrollTop =
                    targetScroll;

                },
                50
              );

            }
          )

          .withFailureHandler(
            function(error) {

              console.error(
                "Leaderboard error:",
                error
              );


              leaderboard.innerHTML =
                '<div class="shared-empty-score">' +
                'LEADERBOARD UNAVAILABLE' +
                '</div>';

            }
          )

          // Every kept score (Config hall_of_fame_count).
          .getGameBoardScores(
            gameName
          );

      }
    );

  }

<script>

  /* ==========================================================
     HIGH SCORE STATE
     ========================================================== */

  let highScoreGameName = "";
  let highScoreValue = 0;

  let highScorePending = false;
  let highScoreSubmitting = false;

  let highScoreReturnCallback = null;

  let highScoreNameLength = 20;


  /* ==========================================================
     ELEMENTS
     ========================================================== */

  const highScoreScreen =
    document.getElementById("highScoreScreen");

  const highScoreNumber =
    document.getElementById("highScoreNumber");

  const nameInput =
    document.getElementById("highScoreNameInput");

  const submitScoreButton =
    document.getElementById("submitScoreButton");

  const submitMessage =
    document.getElementById("submitMessage");


  /* ==========================================================
     LOAD NAME LENGTH CONFIGURATION
     ========================================================== */

  function loadHighScoreNameLength() {

    google.script.run

      .withSuccessHandler(function(length) {

        length =
          Number(length);

        if (
          !Number.isFinite(length) ||
          length < 1
        ) {

          length = 20;

        }

        highScoreNameLength =
          Math.floor(length);

        nameInput.maxLength =
          highScoreNameLength;

      })

      .withFailureHandler(function(error) {

        console.error(
          "Could not load score name length:",
          error
        );

        highScoreNameLength = 20;

        nameInput.maxLength = 20;

      })

      .getHighScoreNameLength();

  }


  /* ==========================================================
     RETURN CALLBACK
     ========================================================== */

  function setHighScoreReturnCallback(callback) {

    highScoreReturnCallback = callback;

  }


  /* ==========================================================
     SHOW HIGH SCORE SCREEN
     ========================================================== */

  function showHighScoreScreen(gameName, score) {

    if (!gameName) return;


    highScoreGameName = gameName;

    highScoreValue =
      Number(score) || 0;

    highScorePending = true;

    highScoreSubmitting = false;


    highScoreNumber.textContent =
      "SCORE: " + highScoreValue;


    nameInput.value = "";

    submitMessage.textContent = "";

    submitScoreButton.disabled = false;

    submitScoreButton.textContent = "SUBMIT";


    /*
     * IMPORTANT:
     * This is a real full-screen layer.
     * It is NOT part of the normal game layout.
     */

    highScoreScreen.style.display = "flex";


    setTimeout(function() {

      nameInput.focus();

    }, 100);

  }


  /* ==========================================================
     HIDE HIGH SCORE SCREEN
     ========================================================== */

  function hideHighScoreScreen() {

    highScorePending = false;

    highScoreSubmitting = false;

    highScoreScreen.style.display = "none";

  }


  /* ==========================================================
     SUBMIT HIGH SCORE
     ========================================================== */

  function submitHighScore() {

    if (
      !highScorePending ||
      highScoreSubmitting
    ) {
      return;
    }


    let playerName =
      nameInput.value
        .trim()
        .toUpperCase()
        .replace(/:/g, "")
        .substring(
          0,
          highScoreNameLength
        );


    if (!playerName) {

      submitMessage.textContent =
        "ENTER A NAME FIRST.";

      nameInput.focus();

      return;

    }


    highScoreSubmitting = true;

    submitScoreButton.disabled = true;

    submitScoreButton.textContent =
      "SAVING...";

    submitMessage.textContent =
      "SUBMITTING SCORE...";


    google.script.run

      /*
       * IMPORTANT:
       *
       * submitHighScore() returns:
       *
       * {
       *   success: true,
       *   rank: 64,
       *   scores: [...]
       * }
       *
       * We pass that result to the game's
       * return callback.
       */

      .withSuccessHandler(function(result) {

        highScorePending = false;

        highScoreSubmitting = false;

        submitMessage.textContent =
          "SCORE SAVED.";

        submitScoreButton.textContent =
          "SAVED";


        setTimeout(function() {

          hideHighScoreScreen();


          if (
            typeof highScoreReturnCallback ===
            "function"
          ) {

            /*
             * Pass the submission result,
             * including the player's rank.
             */

            highScoreReturnCallback(
              result
            );

          }

        }, 700);

      })

      .withFailureHandler(function(error) {

        highScoreSubmitting = false;

        submitScoreButton.disabled = false;

        submitScoreButton.textContent =
          "SUBMIT";

        submitMessage.textContent =
          "ERROR SAVING SCORE. TRY AGAIN.";

        console.error(error);

      })

      .submitHighScore(
        highScoreGameName,
        highScoreValue,
        playerName
      );

  }


  /* ==========================================================
     BUTTON
     ========================================================== */

  submitScoreButton.addEventListener(
    "click",
    submitHighScore
  );

  // SKIP: no name, no save; back to the game's start screen.
  document.getElementById("skipScoreButton").addEventListener(
    "click",
    function() {
      if (highScoreSubmitting) return;
      location.reload();
    }
  );


  /* ==========================================================
     ENTER KEY
     ========================================================== */

  nameInput.addEventListener(
    "keydown",
    function(event) {

      event.stopPropagation();


      if (event.key === "Enter") {

        event.preventDefault();

        submitHighScore();

      }

    }
  );


  /* ==========================================================
     NAME INPUT
     ========================================================== */

  nameInput.addEventListener(
    "input",
    function() {

      this.value =
        this.value
          .toUpperCase()
          .replace(/:/g, "")
          .substring(
            0,
            highScoreNameLength
          );

    }
  );


  /* ==========================================================
     INITIALIZE
     ========================================================== */

  loadHighScoreNameLength();

</script>

<script>

/* ============================================================
   GAME CONFIG
   ============================================================ */

const GAME_NAME = "AlienRun";


/* ============================================================
   CANVAS
   ============================================================ */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");


/*
 * ORIGINAL GAME WORLD
 *
 * Everything below continues to use this
 * 700 × 350 coordinate system.
 */

const BASE_WIDTH = 700;
const BASE_HEIGHT = 350;


/* ============================================================
   GAME VARIABLES
   ============================================================ */

let gameStarted = false;
let gameOver = false;

let score = 0;

let gameSpeed = 5;

let frameCount = 0;

let obstacleTimer = 0;
let flyingTimer = 0;


/* ============================================================
   ALIEN
   ============================================================ */

const alien = {

  x: 100,
  y: 250,

  width: 40,
  height: 50,

  velocityY: 0,

  jumping: false,

  gravity: 0.8,

  jumpPower: -14

};


/* ============================================================
   GROUND
   ============================================================ */

const ground = {

  y: 300,
  height: 3

};


/* ============================================================
   OBSTACLES
   ============================================================ */

let obstacles = [];


/* ============================================================
   FLYING OBJECTS
   ============================================================ */

let flyingObjects = [];


/* ============================================================
   CANVAS RESIZE
   ============================================================ */

function resizeGameCanvas() {

  /*
   * Use 96% of the available phone width.
   * Desktop remains capped at 700px.
   */

  const newWidth =
    Math.min(
      window.innerWidth * 0.96,
      BASE_WIDTH
    );


  const scale =
    newWidth / BASE_WIDTH;


  const newHeight =
    BASE_HEIGHT * scale;


  canvas.width =
    Math.round(newWidth);


  canvas.height =
    Math.round(newHeight);


  draw();

}


/* ============================================================
   SCALE
   ============================================================ */

function getScale() {

  return canvas.width / BASE_WIDTH;

}


/* ============================================================
   SHOW START SCREEN
   ============================================================ */

function showStartScreen(focusRank) {

  gameStarted = false;

  gameOver = false;


  document.getElementById("gameScreen")
    .style.display = "none";


  document.getElementById("gameOverMessage")
    .style.display = "none";


  hideHighScoreScreen();


  document.getElementById("startScreen")
    .style.display = "block";


  /*
   * If focusRank exists, the shared leaderboard
   * centers on the score just submitted.
   */
  loadLeaderboard(
    GAME_NAME,
    focusRank
  );

}


/* ============================================================
   RESET GAME STATE
   ============================================================ */

function resetGameState() {

  gameStarted = false;

  gameOver = false;

  score = 0;

  gameSpeed = 5;

  frameCount = 0;

  obstacleTimer = 0;

  flyingTimer = 0;

  obstacles = [];

  flyingObjects = [];


  alien.x = 100;

  alien.y =
    ground.y -
    alien.height;

  alien.velocityY = 0;

  alien.jumping = false;


  document.getElementById("score")
    .textContent =
      "DISTANCE: 0";


  document.getElementById("gameOverScore")
    .textContent =
      "0";


  document.getElementById("gameOverMessage")
    .style.display =
      "none";

}


/* ============================================================
   START GAME
   ============================================================ */

function startGame() {

  resetGameState();

  hideHighScoreScreen();


  document.getElementById("startScreen")
    .style.display =
      "none";


  document.getElementById("gameScreen")
    .style.display =
      "block";


  resizeGameCanvas();


  gameStarted = true;

}


/* ============================================================
   JUMP
   ============================================================ */

function jump() {

  if (
    !gameStarted ||
    gameOver
  ) {

    return;

  }


  if (!alien.jumping) {

    alien.velocityY =
      alien.jumpPower;

    alien.jumping = true;

  }

}


/* ============================================================
   TOUCH / POINTER PROTECTION
   ============================================================ */

const jumpButton =
  document.getElementById("jumpButton");


if (jumpButton) {

  jumpButton.addEventListener(
    "pointerdown",
    function(event) {

      event.preventDefault();

      event.stopPropagation();

      jump();

    }
  );


  jumpButton.addEventListener(
    "contextmenu",
    function(event) {

      event.preventDefault();

    }
  );


  jumpButton.addEventListener(
    "selectstart",
    function(event) {

      event.preventDefault();

    }
  );

}


/* ============================================================
   PREVENT SELECTION DURING GAMEPLAY
   ============================================================ */

document.addEventListener(
  "selectstart",
  function(event) {

    if (
      gameStarted &&
      !gameOver
    ) {

      event.preventDefault();

    }

  }
);


document.addEventListener(
  "contextmenu",
  function(event) {

    if (
      gameStarted &&
      !gameOver
    ) {

      event.preventDefault();

    }

  }
);


/* ============================================================
   KEYBOARD CONTROLS
   ============================================================ */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.code === "Space" ||
      event.code === "ArrowUp"
    ) {

      event.preventDefault();

      jump();

    }

  }
);


/* ============================================================
   CREATE GROUND OBSTACLE
   ============================================================ */

function createObstacle() {

  const height =
    25 +
    Math.floor(
      Math.random() * 30
    );


  const width =
    20 +
    Math.floor(
      Math.random() * 20
    );


  obstacles.push({

    x:
      BASE_WIDTH + 20,

    y:
      ground.y -
      height,

    width:
      width,

    height:
      height

  });

}


/* ============================================================
   CREATE FLYING OBJECT
   ============================================================ */

function createFlyingObject() {

  const heightChoices = [

    185,
    215,
    240

  ];


  const y =
    heightChoices[
      Math.floor(
        Math.random() *
        heightChoices.length
      )
    ];


  flyingObjects.push({

    x:
      BASE_WIDTH + 30,

    y:
      y,

    width:
      45,

    height:
      12,

    speed:
      gameSpeed +
      1 +
      Math.random() * 2

  });

}


/* ============================================================
   UPDATE ALIEN
   ============================================================ */

function updateAlien() {

  alien.velocityY +=
    alien.gravity;

  alien.y +=
    alien.velocityY;


  const groundTop =
    ground.y -
    alien.height;


  if (
    alien.y >= groundTop
  ) {

    alien.y =
      groundTop;

    alien.velocityY =
      0;

    alien.jumping =
      false;

  }

}


/* ============================================================
   UPDATE OBSTACLES
   ============================================================ */

function updateObstacles() {

  obstacles.forEach(
    function(obstacle) {

      obstacle.x -=
        gameSpeed;

    }
  );


  obstacles =
    obstacles.filter(
      function(obstacle) {

        return (
          obstacle.x +
          obstacle.width >
          0
        );

      }
    );

}


/* ============================================================
   UPDATE FLYING OBJECTS
   ============================================================ */

function updateFlyingObjects() {

  flyingObjects.forEach(
    function(object) {

      object.x -=
        object.speed;

    }
  );


  flyingObjects =
    flyingObjects.filter(
      function(object) {

        return (
          object.x +
          object.width >
          0
        );

      }
    );

}


/* ============================================================
   COLLISION DETECTION
   ============================================================ */

function collision(a, b) {

  const padding = 6;


  return (

    a.x + padding <
      b.x + b.width &&

    a.x + a.width - padding >
      b.x &&

    a.y + padding <
      b.y + b.height &&

    a.y + a.height - padding >
      b.y

  );

}


/* ============================================================
   CHECK COLLISIONS
   ============================================================ */

function checkCollisions() {

  for (
    let i = 0;
    i < obstacles.length;
    i++
  ) {

    if (
      collision(
        alien,
        obstacles[i]
      )
    ) {

      endGame();

      return;

    }

  }


  for (
    let i = 0;
    i < flyingObjects.length;
    i++
  ) {

    if (
      collision(
        alien,
        flyingObjects[i]
      )
    ) {

      endGame();

      return;

    }

  }

}


/* ============================================================
   DRAW ALIEN
   ============================================================ */

function drawAlien() {

  ctx.fillStyle =
    "#00ff00";


  /* Head */

  ctx.fillRect(

    alien.x + 8,

    alien.y,

    24,

    10

  );


  /* Main body */

  ctx.fillRect(

    alien.x + 4,

    alien.y + 10,

    32,

    25

  );


  /* Legs */

  ctx.fillRect(

    alien.x + 8,

    alien.y + 35,

    8,

    15

  );


  ctx.fillRect(

    alien.x + 24,

    alien.y + 35,

    8,

    15

  );


  /* Arms */

  ctx.fillRect(

    alien.x,

    alien.y + 16,

    8,

    18

  );


  ctx.fillRect(

    alien.x + 32,

    alien.y + 16,

    8,

    18

  );


  /* Eyes */

  ctx.fillStyle =
    "#000000";


  ctx.fillRect(

    alien.x + 12,

    alien.y + 3,

    5,

    5

  );


  ctx.fillRect(

    alien.x + 23,

    alien.y + 3,

    5,

    5

  );

}


/* ============================================================
   DRAW OBSTACLES
   ============================================================ */

function drawObstacles() {

  ctx.fillStyle =
    "#ff00ff";


  obstacles.forEach(
    function(obstacle) {

      ctx.fillRect(

        obstacle.x,

        obstacle.y,

        obstacle.width,

        obstacle.height

      );

    }
  );

}


/* ============================================================
   DRAW FLYING OBJECTS
   ============================================================ */

function drawFlyingObjects() {

  ctx.fillStyle =
    "#ffffff";


  flyingObjects.forEach(
    function(object) {

      /* Main body */

      ctx.fillRect(

        object.x + 8,

        object.y,

        29,

        object.height

      );


      /* Nose */

      ctx.fillRect(

        object.x + 37,

        object.y + 3,

        8,

        6

      );


      /* Top */

      ctx.fillRect(

        object.x + 15,

        object.y - 5,

        15,

        5

      );


      /* Bottom */

      ctx.fillRect(

        object.x + 15,

        object.y + object.height,

        15,

        5

      );

    }
  );

}


/* ============================================================
   DRAW GROUND
   ============================================================ */

function drawGround() {

  ctx.fillStyle =
    "#555555";


  ctx.fillRect(

    0,

    ground.y,

    BASE_WIDTH,

    ground.height

  );

}


/* ============================================================
   END GAME
   ============================================================ */

let alienRunEnds = 0;

function endGame() {

  if (gameOver) {

    return;

  }


  gameOver = true;
  // The answer below takes a few seconds; the player may have started
  // a new game by then. Only the game that just ended may show it.
  const endedRun = ++alienRunEnds;
  const endedScore = score;


  document.getElementById("gameOverScore")
    .textContent =
      score;


  document.getElementById("gameOverMessage")
    .style.display =
      "block";


  google.script.run

    .withSuccessHandler(
      function(qualifies) {

        if (qualifies && gameOver && endedRun === alienRunEnds) {

          /*
           * HighScore.html will return the
           * saved rank to this callback.
           */

          setHighScoreReturnCallback(
            function(result) {

              showStartScreen(
                result &&
                result.rank
              );

            }
          );


          showHighScoreScreen(
            GAME_NAME,
            endedScore
          );

        }

      }
    )


    .withFailureHandler(
      function(error) {

        console.error(
          "Qualification error:",
          error
        );

      }
    )


    .qualifiesForHighScore(
      GAME_NAME,
      score
    );

}


/* ============================================================
   PLAY AGAIN
   ============================================================ */

function restartGame() {

  startGame();

}


/* ============================================================
   DRAW
   ============================================================ */

function draw() {

  const scale =
    getScale();


  ctx.clearRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  ctx.save();


  /*
   * From here down we draw in the original
   * 700 × 350 game world.
   *
   * The canvas automatically scales this
   * world to the phone's actual width.
   */

  ctx.scale(
    scale,
    scale
  );


  /* ==========================================================
     BACKGROUND
     ========================================================== */

  ctx.fillStyle =
    "#050505";


  ctx.fillRect(

    0,
    0,

    BASE_WIDTH,
    BASE_HEIGHT

  );


  /* ==========================================================
     STARS
     ========================================================== */

  ctx.fillStyle =
    "#222222";


  for (
    let i = 0;
    i < 35;
    i++
  ) {

    const x =
      (i * 137) %
      BASE_WIDTH;


    const y =
      (i * 73) %
      (BASE_HEIGHT * 0.515);


    ctx.fillRect(

      x,
      y,

      2,
      2

    );

  }


  drawGround();

  drawAlien();

  drawObstacles();

  drawFlyingObjects();


  ctx.restore();

}


/* ============================================================
   UPDATE GAME
   ============================================================ */

function update() {

  if (
    !gameStarted ||
    gameOver
  ) {

    return;

  }


  frameCount++;


  /* Increase score */

  if (
    frameCount % 6 === 0
  ) {

    score++;


    document.getElementById("score")
      .textContent =
        "DISTANCE: " +
        score;

  }


  /* Gradually increase speed */

  if (
    frameCount % 600 === 0
  ) {

    gameSpeed += 0.5;

  }


  /* Ground obstacle timing */

  obstacleTimer--;


  if (
    obstacleTimer <= 0
  ) {

    createObstacle();


    obstacleTimer =
      70 +
      Math.floor(
        Math.random() * 80
      );

  }


  /* Flying object timing */

  flyingTimer--;


  if (
    flyingTimer <= 0
  ) {

    createFlyingObject();


    flyingTimer =
      100 +
      Math.floor(
        Math.random() * 120
      );

  }


  updateAlien();

  updateObstacles();

  updateFlyingObjects();

  checkCollisions();

}


/* ============================================================
   MAIN LOOP
   ============================================================ */

function gameLoop() {

  update();

  draw();


  requestAnimationFrame(
    gameLoop
  );

}


/* ============================================================
   RESIZE HANDLER
   ============================================================ */

window.addEventListener(
  "resize",
  function() {

    resizeGameCanvas();

  }
);


/* ============================================================
   INITIALIZE
   ============================================================ */

resizeGameCanvas();

showStartScreen();

gameLoop();

</script>

      padding: 6px 12px !important;
    }

    .shared-leaderboard-title {
      font-size: 1rem !important;
      margin-bottom: 4px !important;
      padding-bottom: 4px !important;
    }

    .shared-score-row {
      min-height: 30px !important;
      padding: 2px 5px !important;
      font-size: 0.95rem !important;
    }
    .game-button,
    .start-button,
    .play-again-button,
    .difficulty-button,
    .back-button {
      padding-top: 8px !important;
      padding-bottom: 8px !important;
      margin-top: 4px !important;
      margin-bottom: 4px !important;
    }

    .difficulty-label {
      margin: 2px 0 !important;
    }
  }
</style>
<script>
  (function() {

    var MIN_HEIGHT = 140;
    var SLACK = 6;

    function gameCanvas() {
      return document.querySelector("canvas");
    }

    function shown(el) {
      return !!el && el.offsetParent !== null;
    }

    // Lowest point of everything on the page except the canvas,
    // ignoring overlays (fixed / absolute) and hidden elements.
    // Overlays are skipped together with everything inside them.
    function contentBottom(skip) {
      var bottom = 0;

      function walk(parent) {
        var kids = parent.children;

        for (var i = 0; i !== kids.length; i++) {
          var el = kids[i];

          if (el === skip) {
            continue;
          }

          var cs = getComputedStyle(el);

          if (
            cs.display === "none" ||
            cs.position === "fixed" ||
            cs.position === "absolute"
          ) {
            continue;
          }

          var r = el.getBoundingClientRect();

          if (r.width !== 0 || r.height !== 0) {
            var b = r.bottom + (parseFloat(cs.marginBottom) || 0);

            if (b > bottom) {
              bottom = b;
            }
          }

          walk(el);
        }
      }

      walk(document.body);

      return bottom + window.scrollY;
    }

    // Start screen: the leaderboard list already scrolls inside its
    // own box; shrink that box so START stays on screen.
    var LIST_MIN_HEIGHT = 140;
    var LIST_MIN_HEIGHT_SHORT = 80;   // windows under 450 px tall

    function fitList() {
      var list = document.querySelector(".shared-leaderboard-scores");

      if (!shown(list)) {
        return;
      }

      list.style.height = "";

      var over =
        document.documentElement.scrollHeight - window.innerHeight;

      if (over > 0) {
        var current = list.getBoundingClientRect().height;
        list.style.height =
          Math.max(
            window.innerHeight >= 450 ? LIST_MIN_HEIGHT : LIST_MIN_HEIGHT_SHORT,
            Math.floor(current - over - SLACK)
          ) + "px";
      }
    }

    function fit() {
      fitList();

      var canvas = gameCanvas();

      if (!shown(canvas) || !canvas.width) {
        return;
      }

      canvas.style.width = "";
      canvas.style.height = "";

      var natural = canvas.getBoundingClientRect();
      var ratio = canvas.height / canvas.width;

      // Measure everything else with the canvas collapsed.
      canvas.style.height = "0px";
      var other = contentBottom(canvas);
      canvas.style.height = "";

      var available = window.innerHeight - other - SLACK;
      var naturalHeight = natural.width * ratio;

      var h = naturalHeight;

      if (naturalHeight > available) {
        h = Math.max(MIN_HEIGHT, Math.floor(available));
        setHeight(canvas, h, ratio);
      }

      // Padding and margins the measurement can't see: trim by
      // whatever still overflows (two passes at most).
      for (var pass = 0; pass !== 2; pass++) {
        var over =
          document.documentElement.scrollHeight - window.innerHeight;

        if (over > 0 && h > MIN_HEIGHT) {
          h = Math.max(MIN_HEIGHT, Math.floor(h - over - 1));
          setHeight(canvas, h, ratio);
        }
      }
    }

    function setHeight(canvas, h, ratio) {
      canvas.style.height = h + "px";
      canvas.style.width = Math.floor(h / ratio) + "px";
    }

    var timer = 0;

    function later() {
      clearTimeout(timer);
      timer = setTimeout(fit, 60);
    }

    window.tgdFitGame = fit;

    window.addEventListener("resize", later);
    window.addEventListener("orientationchange", later);
    document.addEventListener("click", later, true);
    document.addEventListener("keyup", later, true);

    // Screens change without a resize (START, game over): refit when
    // the canvas appears or the window size changes.
    var lastSignature = "";

    setInterval(function() {
      var canvas = gameCanvas();
      var signature =
        window.innerWidth + "x" + window.innerHeight + ":" +
        (shown(canvas) ? "on" : "off") + ":" +
        (shown(document.querySelector(".shared-leaderboard-scores")) ? "list" : "") + ":" +
        (canvas ? canvas.width + "x" + canvas.height : "");

      if (signature !== lastSignature) {
        lastSignature = signature;
        fit();
      }
    }, 400);

    fit();
  })();
</script>
