<!-- ==========================================================
     SHARED LEADERBOARD
     ========================================================== -->

<div class="shared-leaderboard">

  <div class="shared-leaderboard-title">
    [ TOP X ]
  </div>

  <div class="shared-leaderboard-scores">

    <div class="shared-empty-score">

    </div>

<script>

  /* ==========================================================
     LOAD LEADERBOARD

     focusRank:
       null / undefined = start at #1
       number = center that rank in the window
     ========================================================== */

  function loadLeaderboard(
    gameName,
    focusRank
  ) {

    const boards =
      document.querySelectorAll(
        ".shared-leaderboard"
      );


    if (!boards.length) {

      console.error(
        "Shared leaderboard element not found."
      );

      return;

    }


    boards.forEach(
      function(board) {

        const leaderboard =
          board.querySelector(
            ".shared-leaderboard-scores"
          );


        if (!leaderboard) {

          return;

        }


        /*
         * Every normal leaderboard load starts
         * at the top unless a specific rank was
         * supplied.
         */

        leaderboard.scrollTop = 0;


        if (!gameName) {

          leaderboard.innerHTML =
            '<div class="shared-empty-score">' +
            'LEADERBOARD UNAVAILABLE' +
            '</div>';

          return;

        }


        leaderboard.innerHTML =
          '<div class="shared-empty-score">' +
          'LOADING...' +
          '</div>';


        google.script.run

          .withSuccessHandler(
            function(scores) {

              leaderboard.innerHTML = "";


              if (
                !scores ||
                scores.length === 0
              ) {

                leaderboard.innerHTML =
                  '<div class="shared-empty-score">' +
                  'NO SCORES YET' +
                  '</div>';

                return;

              }


              /* ------------------------------------------------
                 UPDATE TITLE USING ACTUAL SCORE COUNT
                 ------------------------------------------------ */

              const title =
                board.querySelector(
                  ".shared-leaderboard-title"
                );


              if (title) {

                title.textContent =
                  "[ TOP " +
                  scores.length +
                  " ]";

              }


              /* ------------------------------------------------
                 BUILD SCORE ROWS
                 ------------------------------------------------ */

              scores.forEach(
                function(entry, index) {

                  const row =
                    document.createElement(
                      "div"
                    );

                  row.className =
                    "shared-score-row";


                  /*
                   * Store the actual rank on the row.
                   * This lets us find the player's row
                   * after the leaderboard has rendered.
                   */

                  row.dataset.rank =
                    String(index + 1);


                  const rank =
                    document.createElement(
                      "div"
                    );

                  rank.className =
                    "shared-score-rank";

                  rank.textContent =
                    (index + 1) + ".";


                  const name =
                    document.createElement(
                      "div"
                    );

                  name.className =
                    "shared-score-name";

                  name.textContent =
                    entry.name || "";


                  const value =
                    document.createElement(
                      "div"
                    );

                  value.className =
                    "shared-score-value";

                  value.textContent =
                    entry.score !== undefined &&
                    entry.score !== null
                      ? entry.score
                      : "";


                  row.appendChild(rank);

                  row.appendChild(name);

                  row.appendChild(value);

                  leaderboard.appendChild(row);

                }
              );


              /* ------------------------------------------------
                 POSITION LEADERBOARD

                 No focusRank:
                   Start at #1.

                 focusRank:
                   Put that player's row approximately
                   in the center of the visible window.
                 ------------------------------------------------ */

              setTimeout(
                function() {

                  if (
                    focusRank === undefined ||
                    focusRank === null ||
                    !Number.isFinite(
                      Number(focusRank)
                    )
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRank =
                    Math.floor(
                      Number(focusRank)
                    );


                  if (
                    targetRank < 1
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRow =
                    leaderboard.querySelector(
                      '[data-rank="' +
                      targetRank +
                      '"]'
                    );


                  if (!targetRow) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const rowCenter =
                    targetRow.offsetTop +
                    (
                      targetRow.offsetHeight /
                      2
                    );


                  const windowCenter =
                    leaderboard.clientHeight /
                    2;


                  let targetScroll =
                    rowCenter -
                    windowCenter;


                  const maxScroll =
                    leaderboard.scrollHeight -
                    leaderboard.clientHeight;


                  targetScroll =
                    Math.max(
                      0,
                      Math.min(
                        targetScroll,
                        maxScroll
                      )
                    );


                  leaderboard.scrollTop =
                    targetScroll;

                },
                50
              );

            }
          )

          .withFailureHandler(
            function(error) {

              console.error(
                "Leaderboard error:",
                error
              );


              leaderboard.innerHTML =
                '<div class="shared-empty-score">' +
                'LEADERBOARD UNAVAILABLE' +
                '</div>';

            }
          )

          // Every kept score (Config hall_of_fame_count).
          .getGameBoardScores(
            gameName
          );

      }
    );

  }

</script>

<script>

  /* ==========================================================
     HIGH SCORE STATE
     ========================================================== */

  let highScoreGameName = "";
  let highScoreValue = 0;

  let highScorePending = false;
  let highScoreSubmitting = false;

  let highScoreReturnCallback = null;

  let highScoreNameLength = 20;


  /* ==========================================================
     ELEMENTS
     ========================================================== */

  const highScoreScreen =
    document.getElementById("highScoreScreen");

  const highScoreNumber =
    document.getElementById("highScoreNumber");

  const nameInput =
    document.getElementById("highScoreNameInput");

  const submitScoreButton =
    document.getElementById("submitScoreButton");

  const submitMessage =
    document.getElementById("submitMessage");


  /* ==========================================================
     LOAD NAME LENGTH CONFIGURATION
     ========================================================== */

  function loadHighScoreNameLength() {

    google.script.run

      .withSuccessHandler(function(length) {

        length =
          Number(length);

        if (
          !Number.isFinite(length) ||
          length < 1
        ) {

          length = 20;

        }

        highScoreNameLength =
          Math.floor(length);

        nameInput.maxLength =
          highScoreNameLength;

      })

      .withFailureHandler(function(error) {

        console.error(
          "Could not load score name length:",
          error
        );

        highScoreNameLength = 20;

        nameInput.maxLength = 20;

      })

      .getHighScoreNameLength();

  }


  /* ==========================================================
     RETURN CALLBACK
     ========================================================== */

  function setHighScoreReturnCallback(callback) {

    highScoreReturnCallback = callback;

  }


  /* ==========================================================
     SHOW HIGH SCORE SCREEN
     ========================================================== */

  function showHighScoreScreen(gameName, score) {

    if (!gameName) return;


    highScoreGameName = gameName;

    highScoreValue =
      Number(score) || 0;

    highScorePending = true;

    highScoreSubmitting = false;


    highScoreNumber.textContent =
      "SCORE: " + highScoreValue;


    nameInput.value = "";

    submitMessage.textContent = "";

    submitScoreButton.disabled = false;

    submitScoreButton.textContent = "SUBMIT";


    /*
     * IMPORTANT:
     * This is a real full-screen layer.
     * It is NOT part of the normal game layout.
     */

    highScoreScreen.style.display = "flex";


    setTimeout(function() {

      nameInput.focus();

    }, 100);

  }


  /* ==========================================================
     HIDE HIGH SCORE SCREEN
     ========================================================== */

  function hideHighScoreScreen() {

    highScorePending = false;

    highScoreSubmitting = false;

    highScoreScreen.style.display = "none";

  }


  /* ==========================================================
     SUBMIT HIGH SCORE
     ========================================================== */

  function submitHighScore() {

    if (
      !highScorePending ||
      highScoreSubmitting
    ) {
      return;
    }


    let playerName =
      nameInput.value
        .trim()
        .toUpperCase()
        .replace(/:/g, "")
        .substring(
          0,
          highScoreNameLength
        );


    if (!playerName) {

      submitMessage.textContent =
        "ENTER A NAME FIRST.";

      nameInput.focus();

      return;

    }


    highScoreSubmitting = true;

    submitScoreButton.disabled = true;

    submitScoreButton.textContent =
      "SAVING...";

    submitMessage.textContent =
      "SUBMITTING SCORE...";


    google.script.run

      /*
       * IMPORTANT:
       *
       * submitHighScore() returns:
       *
       * {
       *   success: true,
       *   rank: 64,
       *   scores: [...]
       * }
       *
       * We pass that result to the game's
       * return callback.
       */

      .withSuccessHandler(function(result) {

        highScorePending = false;

        highScoreSubmitting = false;

        submitMessage.textContent =

  <script>

    const GAME_NAME = "MeteorMiner";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const BASE_WIDTH = 500;
    const BASE_HEIGHT = 600;


    /*
     * LEVELS
     *
     * Destroy the level's quota of meteors to clear it.
     * Clearing MAX_LEVEL wins the game.
     */
    const MAX_LEVEL = 99;
    const MAX_LIVES = 5;


    let gameStarted = false;
    let gameOver = false;
    let pendingHighScore = false;

    let score = 0;

    let lives = 3;

    let level = 1;
    let levelKills = 0;
    let levelQuota = 10;

    let bannerFrames = 0;

    let meteorSpawnInterval = 66;
    let meteorSpeed = 2;

    let meteorTimer = 0;

    let fireTimer = 0;

    let movingLeft = false;
    let movingRight = false;
    let spaceHeld = false;


    const player = {
      x: 230,
      y: 530,
      width: 40,
      height: 35,
      speed: 7
    };


    let bullets = [];
    let meteors = [];


    /*
     * Cooldown is in frames (about 60 per second).
     * 14 frames is roughly a quarter of a second.
     */
    const FIRE_COOLDOWN = 14;
    const BULLET_SPEED = 9;


    const stars = [];

    for (let i = 0; i < 45; i++) {

      stars.push({
        x: (i * 83) % BASE_WIDTH,
        y: (i * 137) % BASE_HEIGHT
      });

    }


    function showStartScreen(focusRank) {

      gameStarted = false;
      gameOver = false;
      pendingHighScore = false;

      movingLeft = false;
      movingRight = false;
      spaceHeld = false;

      document.getElementById("startScreen").style.display = "block";
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("gameOverScreen").style.display = "none";

      loadLeaderboard(GAME_NAME, focusRank);
    }


    function showGameScreen() {

      document.getElementById("startScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "block";
      document.getElementById("gameOverScreen").style.display = "none";
    }


    function showGameOverScreen() {

      document.getElementById("startScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("gameOverScreen").style.display = "block";

      document.getElementById("finalScore").textContent = score;

      document.getElementById("gameOverTitle").textContent =
        window.meteorWon ? "YOU WIN" : "GAME OVER";
    }


    function resetGame() {

      score = 0;

      lives = 3;

      level = 1;

      movingLeft = false;
      movingRight = false;
      spaceHeld = false;

      window.meteorWon = false;

      player.x = 230;

      setupLevel();

    }


    function setupLevel() {

      levelKills = 0;

      levelQuota = 8 + level * 2;

      meteorSpawnInterval =
        Math.max(28, 66 - (level - 1) * 4);

      meteorSpeed =
        2 + (level - 1) * 0.35;

      meteorTimer = 0;

      fireTimer = 0;

      bullets = [];
      meteors = [];

      bannerFrames = 90;

    }


    function completeLevel() {

      score += 50 * level;

      if (level >= MAX_LEVEL) {

        endGame(true);
        return;

      }

      if (level % 3 === 0 && lives < MAX_LIVES) {
        lives++;
      }

      level++;

      setupLevel();

    }


    function startGame() {

      hideHighScoreScreen();

      resetGame();

      gameStarted = true;
      gameOver = false;
      pendingHighScore = false;

      showGameScreen();

      /*
       * Make sure keyboard input goes to the game,
       * not to a button that was just clicked.
       */
      if (
        document.activeElement &&
        document.activeElement.blur
      ) {
        document.activeElement.blur();
      }

      window.focus();
    }


    function fireBullet() {

      if (!gameStarted ||
          gameOver ||
          pendingHighScore) {
        return;
      }

      if (bannerFrames > 0) {
        return;
      }

      if (fireTimer > 0) {
        return;
      }

      bullets.push({

        x: player.x + player.width / 2 - 2,
        y: player.y - 12,

        width: 4,
        height: 12,

        speed: BULLET_SPEED

      });

      fireTimer = FIRE_COOLDOWN;
    }


    function createMeteor() {

      const size =
        20 + Math.random() * 29;

      let hp = 1;

      if (level >= 8) {

        hp =
          size >= 44
            ? 3
            : (size >= 30 ? 2 : 1);

      } else if (level >= 4) {

        hp =
          size >= 38
            ? 2
            : 1;

      }

      meteors.push({

        x:
          Math.random() *
          (BASE_WIDTH - size),

        y: -size,

        size: size,

        hp: hp,
        maxHp: hp,
        flash: 0,

        speed:
          meteorSpeed *
          (0.75 + Math.random() * 0.6),

        rotation:
          Math.random() * Math.PI * 2,

        rotationSpeed:
          (Math.random() - 0.5) * 0.04

      });

    }


    function update() {

      if (!gameStarted ||
          gameOver ||
          pendingHighScore) {
        return;
      }


      /*
       * PLAYER
       */

      if (movingLeft) {
        player.x -= player.speed;
      }

      if (movingRight) {
        player.x += player.speed;
      }

      if (player.x < 10) {
        player.x = 10;
      }

      if (player.x + player.width > BASE_WIDTH - 10) {
        player.x =
          BASE_WIDTH - 10 - player.width;
      }


      /*
       * LEVEL BANNER PAUSE
       *
       * The ship can move while the banner shows,
       * but nothing spawns yet.
       */

      if (bannerFrames > 0) {

        bannerFrames--;

        return;
      }


      /*
       * FIRING
       */

      if (fireTimer > 0) {
        fireTimer--;
      }

      if (spaceHeld) {
        fireBullet();
      }


      /*
       * BULLETS
       */

      bullets.forEach(function(b) {

        b.y -= b.speed;

      });

      bullets =
        bullets.filter(function(b) {

          return b.y + b.height > 0;

        });


      /*
       * METEOR SPAWNING
       */

      meteorTimer++;

      if (meteorTimer >= meteorSpawnInterval) {

        meteorTimer = 0;

        createMeteor();

        if (
          level >= 6 &&
          Math.random() < 0.25
        ) {
          createMeteor();
        }

      }


      /*
       * METEORS
       */

      meteors.forEach(function(m) {

        m.y += m.speed;
        m.rotation += m.rotationSpeed;

        if (m.flash > 0) {
          m.flash--;
        }

      });


      meteors =
        meteors.filter(function(m) {

          return m.y - m.size < BASE_HEIGHT + 20;

        });


      /*
       * BULLET / METEOR COLLISIONS
       */

      for (
        let i = bullets.length - 1;
        i >= 0;
        i--
      ) {

        const b = bullets[i];


        for (
          let j = meteors.length - 1;
          j >= 0;
          j--
        ) {

          const m = meteors[j];

          if (
            b.x < m.x + m.size &&
            b.x + b.width > m.x &&
            b.y < m.y + m.size &&
            b.y + b.height > m.y
          ) {

            bullets.splice(i, 1);

            m.hp--;

            if (m.hp <= 0) {

              meteors.splice(j, 1);

              score += 10 * m.maxHp;

              levelKills++;

            } else {

              m.flash = 6;

            }

            break;
          }

        }

      }


      /*
       * LEVEL CLEAR
       */

      if (levelKills >= levelQuota) {

        completeLevel();
        return;

      }


      /*
       * METEOR / PLAYER COLLISIONS
       */

      for (
        let i = meteors.length - 1;
        i >= 0;
        i--
      ) {

        const m = meteors[i];

        if (
          m.x < player.x + player.width &&
          m.x + m.size > player.x &&
          m.y < player.y + player.height &&
          m.y + m.size > player.y
        ) {

          meteors.splice(i, 1);

          lives--;

          if (lives <= 0) {

            endGame(false);
            return;

          }

        }

      }

    }


    function endGame(won) {

      if (gameOver || pendingHighScore) {
        return;
      }

      gameOver = true;
      gameStarted = false;

      movingLeft = false;
      movingRight = false;
      spaceHeld = false;

      window.meteorWon = !!won;

      google.script.run
        .withSuccessHandler(function(qualifies) {

          if (qualifies) {

            pendingHighScore = true;

            showHighScoreScreen(
              GAME_NAME,
              score
            );

          } else {

            showGameOverScreen();

          }

        })
        .withFailureHandler(function() {

          showGameOverScreen();

        })
        .qualifiesForHighScore(
          GAME_NAME,
          score
        );
    }


    function draw() {

      const scale =
        canvas.width / BASE_WIDTH;

      ctx.save();

      ctx.setTransform(1, 0, 0, 1, 0, 0);

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.scale(scale, scale);


      /*
       * BACKGROUND
       */

      ctx.fillStyle = "#000";

      ctx.fillRect(
        0,
        0,
        BASE_WIDTH,
        BASE_HEIGHT
      );


      /*
       * STARS
       */

      ctx.fillStyle = "#444";

      stars.forEach(function(s) {

        ctx.fillRect(
          s.x,
          s.y,
          1,
          1
        );

      });


      /*
       * PLAYER SHIP
       */

      ctx.fillStyle = "#00ff00";

      ctx.fillRect(
        player.x + 8,
        player.y + 10,
        player.width - 16,
        player.height - 10
      );


      ctx.beginPath();

      ctx.moveTo(
        player.x + player.width / 2,
        player.y
      );

      ctx.lineTo(
        player.x,
        player.y + player.height
      );

      ctx.lineTo(
        player.x + player.width,
        player.y + player.height
      );

      ctx.closePath();

      ctx.fill();


      /*
       * ENGINE
       */

      ctx.fillStyle = "#ffff00";

      ctx.fillRect(
        player.x + 12,
        player.y + player.height - 2,
        6,
        6
      );

      ctx.fillRect(
        player.x + player.width - 18,
        player.y + player.height - 2,
        6,
        6
      );


      /*
       * BULLETS
       */

      ctx.fillStyle = "#ffff00";

      bullets.forEach(function(b) {

        ctx.fillRect(
          b.x,
          b.y,
          b.width,
          b.height
        );

      });


      /*
       * METEORS
       */

      meteors.forEach(function(m) {

        const centerX =
          m.x + m.size / 2;

        const centerY =
          m.y + m.size / 2;

        ctx.save();

        ctx.translate(
          centerX,
          centerY
        );

        ctx.rotate(m.rotation);


        ctx.fillStyle =
          m.flash > 0
            ? "#ffffff"
            : "#777";

        ctx.beginPath();

        const points = 8;

        for (
          let i = 0;
          i < points;
          i++
        ) {

          const angle =
            (Math.PI * 2 / points) * i;

          const radius =
            m.size / 2 *
            (0.75 + ((i * 17) % 25) / 100);

          const x =
            Math.cos(angle) * radius;

          const y =
            Math.sin(angle) * radius;

          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }

        }

        ctx.closePath();

        ctx.fill();


        /*
         * Outline for meteors that take more than one hit
         */

        if (m.maxHp >= 2) {

          ctx.strokeStyle = "#ffffff";

          ctx.lineWidth =
            m.hp >= 3
              ? 3
              : 1.5;

          ctx.stroke();

        }


        /*
         * METEOR HIGHLIGHT
         */

        ctx.fillStyle = "#aaa";

        ctx.fillRect(
          -m.size * 0.15,
          -m.size * 0.20,
          m.size * 0.18,
          m.size * 0.14
        );


        ctx.fillStyle = "#444";

        ctx.fillRect(
          m.size * 0.10,
          m.size * 0.12,
          m.size * 0.16,
          m.size * 0.12
        );


        ctx.restore();

      });


      /*
       * HUD
       */

      ctx.font =
        'bold 14px "Courier New"';

      ctx.fillStyle = "#00ff00";

      ctx.textAlign = "left";

      ctx.fillText(
        "SCORE " + score,
        10,
        20
      );

      ctx.fillText(
        "LIVES " + lives,
        10,
        38
      );

      ctx.textAlign = "right";

      ctx.fillText(
        "LEVEL " + level,
        BASE_WIDTH - 10,
        20
      );

      ctx.fillStyle = "#777";

      ctx.fillText(
        "METEORS " + levelKills + "/" + levelQuota,
        BASE_WIDTH - 10,
        38
      );


      /*
       * LEVEL BANNER
       */

      if (bannerFrames > 0) {

        ctx.textAlign = "center";

        ctx.font =
          'bold 40px "Courier New"';

        ctx.fillStyle = "#ffff00";

        ctx.fillText(
          "LEVEL " + level,
          BASE_WIDTH / 2,
          BASE_HEIGHT / 2
        );

      }


      ctx.restore();

    }


    function gameLoop() {

      update();
      draw();

      requestAnimationFrame(gameLoop);
    }


    function setupHoldButton(id, onStart, onStop) {

      const button =
        document.getElementById(id);

      function start(e) {

        e.preventDefault();
        e.stopPropagation();

        if (button.setPointerCapture) {
          try {
            button.setPointerCapture(e.pointerId);
          } catch (err) {}
        }

        onStart();
      }


      function stop(e) {

        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }

        onStop();
      }


      button.addEventListener(
        "pointerdown",
        start
      );

      button.addEventListener(
        "pointerup",
        stop
      );

      button.addEventListener(
        "pointercancel",
        stop
      );

      button.addEventListener(
        "lostpointercapture",
        stop
      );

      button.addEventListener(
        "contextmenu",
        function(e) {
          e.preventDefault();
        }
      );

      button.addEventListener(
        "dragstart",
        function(e) {
          e.preventDefault();
        }
      );

      button.addEventListener(
        "selectstart",
        function(e) {
          e.preventDefault();
        }
      );

    }


    setupHoldButton(
      "leftButton",
      function() {
        movingLeft = true;
      },
      function() {
        movingLeft = false;
      }
    );


    setupHoldButton(
      "rightButton",
      function() {
        movingRight = true;
      },
      function() {
        movingRight = false;
      }
    );


    document
      .getElementById("fireButton")
      .addEventListener(
        "pointerdown",
        function(e) {

          e.preventDefault();
          e.stopPropagation();

          fireBullet();

        }
      );


    /*
     * Clicking or tapping the game area makes sure
     * the page has keyboard focus.
     */
    canvas.addEventListener(
      "pointerdown",
      function() {

        window.focus();

      }
    );


    /*
     * KEYBOARD CONTROLS
     *
     * Arrow keys or A / D to move.
     * Space to shoot (hold Space to keep firing).
     */

    function isLeftKey(e) {

      return (
        e.code === "ArrowLeft" ||
        e.code === "KeyA" ||
        e.key === "ArrowLeft" ||
        (e.key && e.key.toLowerCase() === "a")
      );

    }


    function isRightKey(e) {

      return (
        e.code === "ArrowRight" ||
        e.code === "KeyD" ||
        e.key === "ArrowRight" ||
        (e.key && e.key.toLowerCase() === "d")
      );

    }


    function isSpaceKey(e) {

      return (
        e.code === "Space" ||
        e.key === " " ||
        e.key === "Spacebar"
      );

    }


    window.addEventListener(
      "keydown",
      function(e) {

        if (!gameStarted ||
            gameOver ||
            pendingHighScore) {
          return;
        }


        if (isLeftKey(e)) {

          e.preventDefault();
          movingLeft = true;

        }


        if (isRightKey(e)) {

          e.preventDefault();
          movingRight = true;

        }


        if (isSpaceKey(e)) {

          e.preventDefault();
          spaceHeld = true;
          fireBullet();

        }

      },
      true
    );


    window.addEventListener(
      "keyup",
      function(e) {

        if (isLeftKey(e)) {
          movingLeft = false;
        }

        if (isRightKey(e)) {
          movingRight = false;
        }

        if (isSpaceKey(e)) {
          spaceHeld = false;
        }

      },
      true
    );


    window.addEventListener(
      "blur",
      function() {

        movingLeft = false;
        movingRight = false;
        spaceHeld = false;

      }
    );


    setHighScoreReturnCallback(
      function(result) {

        showStartScreen(
          result && result.rank
        );

      }
    );


    resetGame();

    showStartScreen();

    gameLoop();

  </script>

<script>
  (function() {

    var MIN_HEIGHT = 140;
    var SLACK = 6;

    function gameCanvas() {
      return document.querySelector("canvas");
    }

    function shown(el) {
      return !!el && el.offsetParent !== null;
    }

    // Lowest point of everything on the page except the canvas,
    // ignoring overlays (fixed / absolute) and hidden elements.
    // Overlays are skipped together with everything inside them.
    function contentBottom(skip) {
      var bottom = 0;

      function walk(parent) {
        var kids = parent.children;

        for (var i = 0; i !== kids.length; i++) {
          var el = kids[i];

          if (el === skip) {
            continue;
          }

          var cs = getComputedStyle(el);

          if (
            cs.display === "none" ||
            cs.position === "fixed" ||
            cs.position === "absolute"
          ) {
            continue;
          }

          var r = el.getBoundingClientRect();

          if (r.width !== 0 || r.height !== 0) {
            var b = r.bottom + (parseFloat(cs.marginBottom) || 0);

            if (b > bottom) {
              bottom = b;
            }
          }

          walk(el);
        }
      }

      walk(document.body);

      return bottom + window.scrollY;
    }

    // Start screen: the leaderboard list already scrolls inside its
    // own box; shrink that box so START stays on screen.
    var LIST_MIN_HEIGHT = 140;
    var LIST_MIN_HEIGHT_SHORT = 80;   // windows under 450 px tall

    function fitList() {
      var list = document.querySelector(".shared-leaderboard-scores");

      if (!shown(list)) {
        return;
      }

      list.style.height = "";

      var over =
        document.documentElement.scrollHeight - window.innerHeight;

      if (over > 0) {
        var current = list.getBoundingClientRect().height;
        list.style.height =
          Math.max(
            window.innerHeight >= 450 ? LIST_MIN_HEIGHT : LIST_MIN_HEIGHT_SHORT,
            Math.floor(current - over - SLACK)
          ) + "px";
      }
    }

    function fit() {
      fitList();

      var canvas = gameCanvas();

      if (!shown(canvas) || !canvas.width) {
        return;
      }

      canvas.style.width = "";
      canvas.style.height = "";

      var natural = canvas.getBoundingClientRect();
      var ratio = canvas.height / canvas.width;

      // Measure everything else with the canvas collapsed.
      canvas.style.height = "0px";
      var other = contentBottom(canvas);
      canvas.style.height = "";

      var available = window.innerHeight - other - SLACK;
      var naturalHeight = natural.width * ratio;

      var h = naturalHeight;

      if (naturalHeight > available) {
        h = Math.max(MIN_HEIGHT, Math.floor(available));
        setHeight(canvas, h, ratio);
      }

      // Padding and margins the measurement can't see: trim by
      // whatever still overflows (two passes at most).
      for (var pass = 0; pass !== 2; pass++) {
        var over =
          document.documentElement.scrollHeight - window.innerHeight;

        if (over > 0 && h > MIN_HEIGHT) {
          h = Math.max(MIN_HEIGHT, Math.floor(h - over - 1));
          setHeight(canvas, h, ratio);
        }
      }
    }

    function setHeight(canvas, h, ratio) {
      canvas.style.height = h + "px";
      canvas.style.width = Math.floor(h / ratio) + "px";
    }

    var timer = 0;

    function later() {
      clearTimeout(timer);
      timer = setTimeout(fit, 60);
    }

    window.tgdFitGame = fit;

    window.addEventListener("resize", later);
    window.addEventListener("orientationchange", later);
    document.addEventListener("click", later, true);
    document.addEventListener("keyup", later, true);

    // Screens change without a resize (START, game over): refit when
    // the canvas appears or the window size changes.
    var lastSignature = "";

    setInterval(function() {
      var canvas = gameCanvas();
      var signature =
        window.innerWidth + "x" + window.innerHeight + ":" +
        (shown(canvas) ? "on" : "off") + ":" +
        (shown(document.querySelector(".shared-leaderboard-scores")) ? "list" : "") + ":" +
        (canvas ? canvas.width + "x" + canvas.height : "");

      if (signature !== lastSignature) {
        lastSignature = signature;
        fit();
      }
    }, 400);

    fit();
  })();
</script>
