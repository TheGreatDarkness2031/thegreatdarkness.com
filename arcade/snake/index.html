      font-weight: bold;

      letter-spacing: 1px;

      color: #ffff00;

      text-shadow:

       CANVAS
    ========================================== */

      display: block;

      width: 94%;
      max-width: 500px;

      height: auto;

      aspect-ratio: 1 / 1;

      margin: 0 auto;

      border: 2px solid #00aa00;

      background: #000;

      touch-action: none;

      box-shadow:
        0 0 10px rgba(0, 255, 0, 0.12);

      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;

    ========================================== */

      max-width: 500px;

      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      grid-template-rows:

      gap: 8px;

      user-select: none;
      -webkit-user-select: none;

      border: 2px solid #007700;

      background: #000;

      color: #00ff00;

      font-family: "Courier New", monospace;

      font-size: 2rem;

      font-weight: bold;

    }

      grid-column: 2;
      grid-row: 2;
    }

      grid-column: 3;

<!-- ==========================================================

<div class="shared-leaderboard">

<script>

  /* ==========================================================
     LOAD LEADERBOARD

     focusRank:
       null / undefined = start at #1
       number = center that rank in the window
     ========================================================== */

  function loadLeaderboard(
    gameName,
    focusRank
  ) {

    const boards =
      document.querySelectorAll(
        ".shared-leaderboard"
      );


    if (!boards.length) {

      console.error(
        "Shared leaderboard element not found."
      );

      return;

    }


    boards.forEach(
      function(board) {

        const leaderboard =
          board.querySelector(
            ".shared-leaderboard-scores"
          );


        if (!leaderboard) {

          return;

        }


        /*
         * Every normal leaderboard load starts
         * at the top unless a specific rank was
         * supplied.
         */

        leaderboard.scrollTop = 0;


        if (!gameName) {

          leaderboard.innerHTML =
            '<div class="shared-empty-score">' +
            'LEADERBOARD UNAVAILABLE' +
            '</div>';

          return;

        }


        leaderboard.innerHTML =
          '<div class="shared-empty-score">' +
          'LOADING...' +
          '</div>';


        google.script.run

          .withSuccessHandler(
            function(scores) {

              leaderboard.innerHTML = "";


              if (
                !scores ||
                scores.length === 0
              ) {

                leaderboard.innerHTML =
                  '<div class="shared-empty-score">' +
                  'NO SCORES YET' +
                  '</div>';

                return;

              }


              /* ------------------------------------------------
                 UPDATE TITLE USING ACTUAL SCORE COUNT
                 ------------------------------------------------ */

              const title =
                board.querySelector(
                  ".shared-leaderboard-title"
                );


              if (title) {

                title.textContent =
                  "[ TOP " +
                  scores.length +
                  " ]";

              }


              /* ------------------------------------------------
                 BUILD SCORE ROWS
                 ------------------------------------------------ */

              scores.forEach(
                function(entry, index) {

                  const row =
                    document.createElement(
                      "div"
                    );

                  row.className =
                    "shared-score-row";


                  /*
                   * Store the actual rank on the row.
                   * This lets us find the player's row
                   * after the leaderboard has rendered.
                   */

                  row.dataset.rank =
                    String(index + 1);


                  const rank =
                    document.createElement(
                      "div"
                    );

                  rank.className =
                    "shared-score-rank";

                  rank.textContent =
                    (index + 1) + ".";


                  const name =
                    document.createElement(
                      "div"
                    );

                  name.className =
                    "shared-score-name";

                  name.textContent =
                    entry.name || "";


                  const value =
                    document.createElement(
                      "div"
                    );

                  value.className =
                    "shared-score-value";

                  value.textContent =
                    entry.score !== undefined &&
                    entry.score !== null
                      ? entry.score
                      : "";


                  row.appendChild(rank);

                  row.appendChild(name);

                  row.appendChild(value);

                  leaderboard.appendChild(row);

                }
              );


              /* ------------------------------------------------
                 POSITION LEADERBOARD

                 No focusRank:
                   Start at #1.

                 focusRank:
                   Put that player's row approximately
                   in the center of the visible window.
                 ------------------------------------------------ */

              setTimeout(
                function() {

                  if (
                    focusRank === undefined ||
                    focusRank === null ||
                    !Number.isFinite(
                      Number(focusRank)
                    )
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRank =
                    Math.floor(
                      Number(focusRank)
                    );


                  if (
                    targetRank < 1
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRow =
                    leaderboard.querySelector(
                      '[data-rank="' +
                      targetRank +
                      '"]'
                    );


                  if (!targetRow) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const rowCenter =
                    targetRow.offsetTop +
                    (
                      targetRow.offsetHeight /
                      2
                    );


                  const windowCenter =
                    leaderboard.clientHeight /
                    2;


                  let targetScroll =
                    rowCenter -
                    windowCenter;


                  const maxScroll =
                    leaderboard.scrollHeight -
                    leaderboard.clientHeight;


                  targetScroll =
                    Math.max(
                      0,
                      Math.min(
                        targetScroll,
                        maxScroll
                      )
                    );


                  leaderboard.scrollTop =
                    targetScroll;

                },
                50
              );

            }
          )

          .withFailureHandler(
            function(error) {

              console.error(
                "Leaderboard error:",
                error
              );


              leaderboard.innerHTML =
                '<div class="shared-empty-score">' +
                'LEADERBOARD UNAVAILABLE' +
                '</div>';

            }
          )

          // Every kept score (Config hall_of_fame_count).
          .getGameBoardScores(
            gameName
          );

      }
    );

  }

<script>

  /* ==========================================================
     HIGH SCORE STATE
     ========================================================== */

  let highScoreGameName = "";
  let highScoreValue = 0;

  let highScorePending = false;
  let highScoreSubmitting = false;

  let highScoreReturnCallback = null;

  let highScoreNameLength = 20;


  /* ==========================================================
     ELEMENTS
     ========================================================== */

  const highScoreScreen =

  const highScoreNumber =

  const nameInput =

  const submitScoreButton =

  const submitMessage =
    document.getElementById("submitMessage");


  /* ==========================================================
     LOAD NAME LENGTH CONFIGURATION
     ========================================================== */

  function loadHighScoreNameLength() {

    google.script.run

      .withSuccessHandler(function(length) {

        length =
          Number(length);

        if (
          !Number.isFinite(length) ||
          length < 1
        ) {

          length = 20;

        }

        highScoreNameLength =
          Math.floor(length);

        nameInput.maxLength =
          highScoreNameLength;

      })

      .withFailureHandler(function(error) {

        console.error(
          "Could not load score name length:",
          error
        );

        highScoreNameLength = 20;

        nameInput.maxLength = 20;

      })

      .getHighScoreNameLength();

  }


  /* ==========================================================
     RETURN CALLBACK
     ========================================================== */

  function setHighScoreReturnCallback(callback) {

    highScoreReturnCallback = callback;

  }


  /* ==========================================================
     SHOW HIGH SCORE SCREEN
     ========================================================== */

  function showHighScoreScreen(gameName, score) {

    if (!gameName) return;


    highScoreGameName = gameName;

    highScoreValue =
      Number(score) || 0;

    highScorePending = true;

    highScoreSubmitting = false;


    highScoreNumber.textContent =
      "SCORE: " + highScoreValue;


    nameInput.value = "";

    submitMessage.textContent = "";

    submitScoreButton.disabled = false;

    submitScoreButton.textContent = "SUBMIT";


    /*
     * IMPORTANT:
     * This is a real full-screen layer.
     * It is NOT part of the normal game layout.
     */

    highScoreScreen.style.display = "flex";


    setTimeout(function() {

      nameInput.focus();

    }, 100);

  }


  /* ==========================================================
     HIDE HIGH SCORE SCREEN
     ========================================================== */

  function hideHighScoreScreen() {

    highScorePending = false;

    highScoreSubmitting = false;

    highScoreScreen.style.display = "none";

  }


  /* ==========================================================
     SUBMIT HIGH SCORE
     ========================================================== */

  function submitHighScore() {

    if (
      !highScorePending ||
      highScoreSubmitting
    ) {
      return;
    }


    let playerName =
      nameInput.value
        .trim()
        .toUpperCase()
        .replace(/:/g, "")
        .substring(
          0,
          highScoreNameLength
        );


    if (!playerName) {

      submitMessage.textContent =
        "ENTER A NAME FIRST.";

      nameInput.focus();

      return;

    }


    highScoreSubmitting = true;

    submitScoreButton.disabled = true;

    submitScoreButton.textContent =
      "SAVING...";

    submitMessage.textContent =
      "SUBMITTING SCORE...";


    google.script.run

      /*
       * IMPORTANT:
       *
       * submitHighScore() returns:
       *
       * {
       *   success: true,
       *   rank: 64,
       *   scores: [...]
       * }
       *
       * We pass that result to the game's
       * return callback.
       */

      .withSuccessHandler(function(result) {

        highScorePending = false;

        highScoreSubmitting = false;

        submitMessage.textContent =
          "SCORE SAVED.";

        submitScoreButton.textContent =
          "SAVED";


        setTimeout(function() {

          hideHighScoreScreen();


          if (
            typeof highScoreReturnCallback ===
            "function"
          ) {

            /*
             * Pass the submission result,
             * including the player's rank.
             */

            highScoreReturnCallback(
              result
            );

          }

        }, 700);

      })

      .withFailureHandler(function(error) {

        highScoreSubmitting = false;

        submitScoreButton.disabled = false;

        submitScoreButton.textContent =
          "SUBMIT";

        submitMessage.textContent =
          "ERROR SAVING SCORE. TRY AGAIN.";

        console.error(error);

      })

      .submitHighScore(
        highScoreGameName,
        highScoreValue,
        playerName
      );

  }


  /* ==========================================================
     BUTTON
     ========================================================== */

  submitScoreButton.addEventListener(
    "click",
    submitHighScore
  );

  // SKIP: no name, no save; back to the game's start screen.
  document.getElementById("skipScoreButton").addEventListener(
    "click",
    function() {
      if (highScoreSubmitting) return;
      location.reload();
    }
  );


  /* ==========================================================
     ENTER KEY
     ========================================================== */

  nameInput.addEventListener(
    "keydown",
    function(event) {

      event.stopPropagation();


      if (event.key === "Enter") {

        event.preventDefault();

        submitHighScore();

      }

    }
  );


  /* ==========================================================
     NAME INPUT
     ========================================================== */

  nameInput.addEventListener(
    "input",
    function() {

      this.value =
        this.value
          .toUpperCase()
          .replace(/:/g, "")
          .substring(
            0,
            highScoreNameLength
          );

    }
  );


  /* ==========================================================
     INITIALIZE
     ========================================================== */

  loadHighScoreNameLength();

</script>


  <script>


    /* =========================================
       GAME SETTINGS
    ========================================== */

    const GAME_NAME = "Snake";

    const BASE_SIZE = 500;

    const canvas =
      document.getElementById("gameCanvas");

    const ctx =
      canvas.getContext("2d");

    const gridSize = 20;

    const tileSize =
      BASE_SIZE / gridSize;

    const startingSpeed = 180;

    const minimumSpeed = 60;

    const speedIncrease = 4;


    /* =========================================
       DOM ELEMENTS
    ========================================== */

    const startScreen =
      document.getElementById("startScreen");

    const gameScreen =
      document.getElementById("gameScreen");

    const gameOverScreen =
      document.getElementById("gameOverScreen");

    const startButton =
      document.getElementById("startButton");

    const playAgainButton =
      document.getElementById("playAgainButton");

    const scoreDisplay =
      document.getElementById("scoreDisplay");

    const finalScore =
      document.getElementById("finalScore");


    /* =========================================
       GAME STATE
    ========================================== */

    let snake = [];

    let food = {};

    let direction = {
      x: 1,
      y: 0
    };

    let nextDirection = {
      x: 1,
      y: 0
    };

    let score = 0;

    let gameRunning = false;

    let gameOver = false;

    let gameTimer = null;

    let currentSpeed =
      startingSpeed;


    /* =========================================
       PERSONAL HIGH SCORE
    ========================================== */

    let personalHighScore =
      parseInt(
        localStorage.getItem(
          "greatDarknessSnakeHigh"
        ) || "0",
        10
      );


    /* =========================================
       SHOW START SCREEN
    ========================================== */

    function showStartScreen(focusRank) {

      clearTimeout(gameTimer);

      gameRunning = false;

      gameOver = false;


      startScreen.style.display =
        "block";

      gameScreen.style.display =
        "none";

      gameOverScreen.style.display =
        "none";


      hideHighScoreScreen();


      loadLeaderboard(
        GAME_NAME,
        focusRank
      );

    }


    /* =========================================
       START GAME
    ========================================== */

    function startGame() {

      clearTimeout(gameTimer);


      startScreen.style.display =
        "none";

      gameScreen.style.display =
        "block";

      gameOverScreen.style.display =
        "none";


      hideHighScoreScreen();


      snake = [

        { x: 10, y: 10 },

        { x: 9, y: 10 },

        { x: 8, y: 10 },

        { x: 7, y: 10 }

      ];


      direction = {
        x: 1,
        y: 0
      };


      nextDirection = {
        x: 1,
        y: 0
      };


      score = 0;


      currentSpeed =
        startingSpeed;


      gameRunning = true;

      gameOver = false;


      updateScore();

      placeFood();

      draw();

      scheduleNextMove();

    }


    /* =========================================
       GAME LOOP
    ========================================== */

    function scheduleNextMove() {

      if (!gameRunning) {
        return;
      }


      gameTimer =
        setTimeout(
          function() {

            update();


            if (gameRunning) {

              draw();

              scheduleNextMove();

            }

          },
          currentSpeed
        );

    }


    /* =========================================
       UPDATE
    ========================================== */

    function update() {

      direction =
        nextDirection;


      const head = {

        x:
          snake[0].x +
          direction.x,

        y:
          snake[0].y +
          direction.y

      };


      /* WALL COLLISION */

      if (

        head.x < 0 ||

        head.x >= gridSize ||

        head.y < 0 ||

        head.y >= gridSize

      ) {

        endGame();

        return;

      }


      /* SELF COLLISION */

      for (

        let i = 0;

        i < snake.length;

        i++

      ) {

        if (

          head.x === snake[i].x &&

          head.y === snake[i].y

        ) {

          endGame();

          return;

        }

      }


      snake.unshift(head);


      /* FOOD */

      if (

        head.x === food.x &&

        head.y === food.y

      ) {

        score += 10;


        updateScore();


        if (
          score >
          personalHighScore
        ) {

          personalHighScore =
            score;


          localStorage.setItem(
            "greatDarknessSnakeHigh",
            personalHighScore
          );

        }


        currentSpeed =
          Math.max(

            minimumSpeed,

            startingSpeed -

            (
              (score / 10) *
              speedIncrease
            )

          );


        placeFood();


      } else {

        snake.pop();

      }

    }


    /* =========================================
       PLACE FOOD
    ========================================== */

    function placeFood() {

      let valid = false;


      while (!valid) {

        food = {

          x:
            Math.floor(
              Math.random() *
              gridSize
            ),

          y:
            Math.floor(
              Math.random() *
              gridSize
            )

        };


        valid = true;


        for (

          let i = 0;

          i < snake.length;

          i++

        ) {

          if (

            snake[i].x === food.x &&

            snake[i].y === food.y

          ) {

            valid = false;

            break;

          }

        }

      }

    }


    /* =========================================
       DRAW
    ========================================== */

    function draw() {

      const scale =
        canvas.width /
        BASE_SIZE;


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.save();


      ctx.scale(
        scale,
        scale
      );


      /* BACKGROUND */

      ctx.fillStyle =
        "#000";


      ctx.fillRect(
        0,
        0,
        BASE_SIZE,
        BASE_SIZE
      );


      /* FOOD */

      ctx.fillStyle =
        "#ff3333";


      ctx.fillRect(

        food.x * tileSize + 3,

        food.y * tileSize + 3,

        tileSize - 6,

        tileSize - 6

      );


      /* SNAKE */

      snake.forEach(
        function(
          segment,
          index
        ) {

          ctx.fillStyle =
            index === 0
              ? "#00ff00"
              : "#009900";


          ctx.fillRect(

            segment.x *
              tileSize + 2,

            segment.y *
              tileSize + 2,

            tileSize - 4,

            tileSize - 4

          );

        }
      );


      ctx.restore();

    }


    /* =========================================
       SCORE
    ========================================== */

    function updateScore() {

      scoreDisplay.textContent =
        "SCORE: " + score;

    }


    /* =========================================
       END GAME
    ========================================== */

    function endGame() {

      clearTimeout(gameTimer);


      gameRunning = false;

      gameOver = true;


      finalScore.textContent =
        "SCORE: " + score;


      checkScoreQualification();

    }


    /* =========================================
       CHECK QUALIFICATION
    ========================================== */

    function checkScoreQualification() {

      google.script.run

        .withSuccessHandler(
          function(qualifies) {

            if (qualifies) {

              setHighScoreReturnCallback(
                function(result) {

                  showStartScreen(
                    result &&
                    result.rank
                  );

                }
              );


              showHighScoreScreen(
                GAME_NAME,
                score
              );


            } else {

              showGameOverScreen();

            }

          }
        )


        .withFailureHandler(
          function(error) {

            console.error(
              "Qualification error:",
              error
            );


            showGameOverScreen();

          }
        )


        .qualifiesForHighScore(
          GAME_NAME,
          score
        );

    }


    /* =========================================
       SHOW GAME OVER SCREEN
    ========================================== */

    function showGameOverScreen() {

      startScreen.style.display =
        "none";

      gameScreen.style.display =
        "none";

      gameOverScreen.style.display =
        "block";


      hideHighScoreScreen();

    }


    /* =========================================
       KEYBOARD CONTROLS
    ========================================== */

    document.addEventListener(

      "keydown",

      function(event) {

        if (highScorePending) {
          return;
        }


        const target =
          event.target;


        if (

          target &&

          (

            target.tagName === "INPUT" ||

            target.tagName === "TEXTAREA" ||

            target.tagName === "SELECT" ||

            target.isContentEditable

          )

        ) {

          return;

        }


        if (!gameRunning) {

          if (

            gameOver &&

            (

              event.key === " " ||

              event.key === "Enter"

            )

          ) {

            event.preventDefault();

            startGame();

          }

          return;

        }


        const key =
          event.key.toLowerCase();


        if (

          key === "arrowup" ||

          key === "w"

        ) {

          if (
            direction.y === 0
          ) {

            nextDirection = {
              x: 0,
              y: -1
            };

          }


          event.preventDefault();

        }


        else if (

          key === "arrowdown" ||

          key === "s"

        ) {

          if (
            direction.y === 0
          ) {

            nextDirection = {
              x: 0,
              y: 1
            };

          }


          event.preventDefault();

        }


        else if (

          key === "arrowleft" ||

          key === "a"

        ) {

          if (
            direction.x === 0
          ) {

            nextDirection = {
              x: -1,
              y: 0
            };

          }


          event.preventDefault();

        }


        else if (

          key === "arrowright" ||

          key === "d"

        ) {

          if (
            direction.x === 0
          ) {

            nextDirection = {
              x: 1,
              y: 0
            };

          }


          event.preventDefault();

        }

      }

    );


    /* =========================================
       MOBILE CONTROLS
    ========================================== */

    function setDirection(x, y) {

      if (
        !gameRunning ||
        highScorePending
      ) {

        return;

      }


      if (

        x !== 0 &&

        direction.x !== 0

      ) {

        return;

      }


      if (

        y !== 0 &&

        direction.y !== 0

      ) {

        return;

      }


      nextDirection = {
        x: x,
        y: y
      };

    }


    function setupControl(
      button,
      x,
      y
    ) {

      function handlePointerDown(event) {

        event.preventDefault();

        event.stopPropagation();


        setDirection(
          x,
          y
        );


        try {

          button.setPointerCapture(
            event.pointerId
          );

        } catch (error) {

          // Ignore pointer capture errors.

        }

      }


      function handlePointerEnd(event) {

        event.preventDefault();

        event.stopPropagation();

      }


      button.addEventListener(
        "pointerdown",
        handlePointerDown
      );


      button.addEventListener(
        "pointerup",
        handlePointerEnd
      );


      button.addEventListener(
        "pointercancel",
        handlePointerEnd
      );


      button.addEventListener(
        "lostpointercapture",
        handlePointerEnd
      );


      button.addEventListener(
        "contextmenu",
        function(event) {

          event.preventDefault();

        }
      );


      button.addEventListener(
        "selectstart",
        function(event) {

          event.preventDefault();

        }
      );


      button.addEventListener(
        "dragstart",
        function(event) {

          event.preventDefault();

        }
      );

    }


    setupControl(
      document.getElementById("upButton"),
      0,
      -1
    );


    setupControl(
      document.getElementById("downButton"),
      0,
      1
    );


    setupControl(
      document.getElementById("leftButton"),
      -1,
      0
    );


    setupControl(
      document.getElementById("rightButton"),
      1,
      0
    );


    /* =========================================
       BUTTONS
    ========================================== */

    startButton.addEventListener(
      "click",
      startGame
    );


    playAgainButton.addEventListener(
      "click",
      startGame
    );


    /* =========================================
       INITIALIZE SHARED HIGH SCORE
    ========================================== */

    setHighScoreReturnCallback(
      function() {
        showStartScreen();
      }
    );


    /* =========================================
       INITIALIZE
    ========================================== */

    showStartScreen();

  </script>


<!-- ==========================================================

     Included at the end of every arcade game, after its own script.
     - Computers (mouse, no touch): the on-screen touch buttons are

<script>
  (function() {

    var MIN_HEIGHT = 140;
    var SLACK = 6;

    function gameCanvas() {
      return document.querySelector("canvas");
    }

    function shown(el) {
      return !!el && el.offsetParent !== null;
    }

    // Lowest point of everything on the page except the canvas,
    // ignoring overlays (fixed / absolute) and hidden elements.
    // Overlays are skipped together with everything inside them.
    function contentBottom(skip) {
      var bottom = 0;

      function walk(parent) {
        var kids = parent.children;

        for (var i = 0; i !== kids.length; i++) {
          var el = kids[i];

          if (el === skip) {
            continue;
          }

          var cs = getComputedStyle(el);

          if (
            cs.display === "none" ||
            cs.position === "fixed" ||
            cs.position === "absolute"
          ) {
            continue;
          }

          var r = el.getBoundingClientRect();

          if (r.width !== 0 || r.height !== 0) {
            var b = r.bottom + (parseFloat(cs.marginBottom) || 0);

            if (b > bottom) {
              bottom = b;
            }
          }

          walk(el);
        }
      }

      walk(document.body);

      return bottom + window.scrollY;
    }

    // Start screen: the leaderboard list already scrolls inside its
    // own box; shrink that box so START stays on screen.
    var LIST_MIN_HEIGHT = 140;
    var LIST_MIN_HEIGHT_SHORT = 80;   // windows under 450 px tall

    function fitList() {
      var list = document.querySelector(".shared-leaderboard-scores");

      if (!shown(list)) {
        return;
      }

      list.style.height = "";

      var over =
        document.documentElement.scrollHeight - window.innerHeight;

      if (over > 0) {
        var current = list.getBoundingClientRect().height;
        list.style.height =
          Math.max(
            window.innerHeight >= 450 ? LIST_MIN_HEIGHT : LIST_MIN_HEIGHT_SHORT,
            Math.floor(current - over - SLACK)
          ) + "px";
      }
    }

    function fit() {
      fitList();

      var canvas = gameCanvas();

      if (!shown(canvas) || !canvas.width) {
        return;
      }

      canvas.style.width = "";
      canvas.style.height = "";

      var natural = canvas.getBoundingClientRect();
      var ratio = canvas.height / canvas.width;

      // Measure everything else with the canvas collapsed.
      canvas.style.height = "0px";
      var other = contentBottom(canvas);
      canvas.style.height = "";

      var available = window.innerHeight - other - SLACK;
      var naturalHeight = natural.width * ratio;

      var h = naturalHeight;

      if (naturalHeight > available) {
        h = Math.max(MIN_HEIGHT, Math.floor(available));
        setHeight(canvas, h, ratio);
      }

      // Padding and margins the measurement can't see: trim by
      // whatever still overflows (two passes at most).
      for (var pass = 0; pass !== 2; pass++) {
        var over =
          document.documentElement.scrollHeight - window.innerHeight;

        if (over > 0 && h > MIN_HEIGHT) {
          h = Math.max(MIN_HEIGHT, Math.floor(h - over - 1));
          setHeight(canvas, h, ratio);
        }
      }
    }

    function setHeight(canvas, h, ratio) {
      canvas.style.height = h + "px";
      canvas.style.width = Math.floor(h / ratio) + "px";
    }

    var timer = 0;

    function later() {
      clearTimeout(timer);
      timer = setTimeout(fit, 60);
    }

    window.tgdFitGame = fit;

    window.addEventListener("resize", later);
    window.addEventListener("orientationchange", later);
    document.addEventListener("click", later, true);
    document.addEventListener("keyup", later, true);

    // Screens change without a resize (START, game over): refit when
    // the canvas appears or the window size changes.
    var lastSignature = "";

    setInterval(function() {
      var canvas = gameCanvas();
      var signature =
        window.innerWidth + "x" + window.innerHeight + ":" +
        (shown(canvas) ? "on" : "off") + ":" +
        (shown(document.querySelector(".shared-leaderboard-scores")) ? "list" : "") + ":" +
        (canvas ? canvas.width + "x" + canvas.height : "");

      if (signature !== lastSignature) {
        lastSignature = signature;
        fit();
      }
    }, 400);

    fit();
  })();
</script>
