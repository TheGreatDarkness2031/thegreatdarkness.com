<!-- ==========================================================

<div class="shared-leaderboard">

  <div class="shared-leaderboard-title">

<script>

  /* ==========================================================
     LOAD LEADERBOARD

     focusRank:
       null / undefined = start at #1
       number = center that rank in the window
     ========================================================== */

  function loadLeaderboard(
    gameName,
    focusRank
  ) {

    const boards =
      document.querySelectorAll(
        ".shared-leaderboard"
      );


    if (!boards.length) {

      console.error(
        "Shared leaderboard element not found."
      );

      return;

    }


    boards.forEach(
      function(board) {

        const leaderboard =
          board.querySelector(
            ".shared-leaderboard-scores"
          );


        if (!leaderboard) {

          return;

        }


        /*
         * Every normal leaderboard load starts
         * at the top unless a specific rank was
         * supplied.
         */

        leaderboard.scrollTop = 0;


        if (!gameName) {

          leaderboard.innerHTML =
            '<div class="shared-empty-score">' +
            'LEADERBOARD UNAVAILABLE' +
            '</div>';

          return;

        }


        leaderboard.innerHTML =
          '<div class="shared-empty-score">' +
          'LOADING...' +
          '</div>';


        google.script.run

          .withSuccessHandler(
            function(scores) {

              leaderboard.innerHTML = "";


              if (
                !scores ||
                scores.length === 0
              ) {

                leaderboard.innerHTML =
                  '<div class="shared-empty-score">' +
                  'NO SCORES YET' +
                  '</div>';

                return;

              }


              /* ------------------------------------------------
                 UPDATE TITLE USING ACTUAL SCORE COUNT
                 ------------------------------------------------ */

              const title =
                board.querySelector(
                  ".shared-leaderboard-title"
                );


              if (title) {

                title.textContent =
                  "[ TOP " +
                  scores.length +
                  " ]";

              }


              /* ------------------------------------------------
                 BUILD SCORE ROWS
                 ------------------------------------------------ */

              scores.forEach(
                function(entry, index) {

                  const row =
                    document.createElement(
                      "div"
                    );

                  row.className =
                    "shared-score-row";


                  /*
                   * Store the actual rank on the row.
                   * This lets us find the player's row
                   * after the leaderboard has rendered.
                   */

                  row.dataset.rank =
                    String(index + 1);


                  const rank =
                    document.createElement(
                      "div"
                    );

                  rank.className =
                    "shared-score-rank";

                  rank.textContent =
                    (index + 1) + ".";


                  const name =
                    document.createElement(
                      "div"
                    );

                  name.className =
                    "shared-score-name";

                  name.textContent =
                    entry.name || "";


                  const value =
                    document.createElement(
                      "div"
                    );

                  value.className =
                    "shared-score-value";

                  value.textContent =
                    entry.score !== undefined &&
                    entry.score !== null
                      ? entry.score
                      : "";


                  row.appendChild(rank);

                  row.appendChild(name);

                  row.appendChild(value);

                  leaderboard.appendChild(row);

                }
              );


              /* ------------------------------------------------
                 POSITION LEADERBOARD

                 No focusRank:
                   Start at #1.

                 focusRank:
                   Put that player's row approximately
                   in the center of the visible window.
                 ------------------------------------------------ */

              setTimeout(
                function() {

                  if (
                    focusRank === undefined ||
                    focusRank === null ||
                    !Number.isFinite(
                      Number(focusRank)
                    )
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRank =
                    Math.floor(
                      Number(focusRank)
                    );


                  if (
                    targetRank < 1
                  ) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const targetRow =
                    leaderboard.querySelector(
                      '[data-rank="' +
                      targetRank +
                      '"]'
                    );


                  if (!targetRow) {

                    leaderboard.scrollTop = 0;

                    return;

                  }


                  const rowCenter =
                    targetRow.offsetTop +
                    (
                      targetRow.offsetHeight /
                      2
                    );


                  const windowCenter =
                    leaderboard.clientHeight /
                    2;


                  let targetScroll =
                    rowCenter -
                    windowCenter;


                  const maxScroll =
                    leaderboard.scrollHeight -
                    leaderboard.clientHeight;


                  targetScroll =
                    Math.max(
                      0,
                      Math.min(
                        targetScroll,
                        maxScroll
                      )
                    );


                  leaderboard.scrollTop =
                    targetScroll;

                },
                50
              );

            }
          )

          .withFailureHandler(
            function(error) {

              console.error(
                "Leaderboard error:",
                error
              );


              leaderboard.innerHTML =
                '<div class="shared-empty-score">' +
                'LEADERBOARD UNAVAILABLE' +
                '</div>';

            }
          )

          // Every kept score (Config hall_of_fame_count).
          .getGameBoardScores(
            gameName
          );

      }
    );

  }

</script>

<script>

  /* ==========================================================
     HIGH SCORE STATE
     ========================================================== */

  let highScoreGameName = "";
  let highScoreValue = 0;

  let highScorePending = false;
  let highScoreSubmitting = false;

  let highScoreReturnCallback = null;

  let highScoreNameLength = 20;


  /* ==========================================================
     ELEMENTS
     ========================================================== */

  const highScoreScreen =
    document.getElementById("highScoreScreen");

  const highScoreNumber =
    document.getElementById("highScoreNumber");

  const nameInput =
    document.getElementById("highScoreNameInput");

  const submitScoreButton =
    document.getElementById("submitScoreButton");

  const submitMessage =
    document.getElementById("submitMessage");


  /* ==========================================================
     LOAD NAME LENGTH CONFIGURATION
     ========================================================== */

  function loadHighScoreNameLength() {

    google.script.run

      .withSuccessHandler(function(length) {

        length =
          Number(length);

        if (
          !Number.isFinite(length) ||
          length < 1
        ) {

          length = 20;

        }

        highScoreNameLength =
          Math.floor(length);

        nameInput.maxLength =
          highScoreNameLength;

      })

      .withFailureHandler(function(error) {

        console.error(
          "Could not load score name length:",
          error
        );

        highScoreNameLength = 20;

        nameInput.maxLength = 20;

      })

      .getHighScoreNameLength();

  }


  /* ==========================================================
     RETURN CALLBACK
     ========================================================== */

  function setHighScoreReturnCallback(callback) {

    highScoreReturnCallback = callback;

  }


  /* ==========================================================

  function showHighScoreScreen(gameName, score) {

  function submitHighScore() {

      /*

  /* ==========================================================

  submitScoreButton.addEventListener(

  // SKIP: no name, no save; back to the game's start screen.

  <script>

    const GAME_NAME = "SectorSweep";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const modeButton = document.getElementById("modeButton");

    /*
     * DIFFICULTY SETTINGS
     * cell: drawing size of one square (the page shrinks it to fit).
     * Hard turns sideways (20 wide, 16 tall) on wide screens.
     * Score: every safe square opened is worth "mult"; clearing the
     * sector adds "winBonus" plus (par - seconds) x mult.
     */
    const DIFFICULTIES = {
      easy: {
        label: "EASY", cols: 9, rows: 9, mines: 10, cell: 48,
        mult: 1, winBonus: 100, par: 180
      },
      medium: {
        label: "MEDIUM", cols: 16, rows: 16, mines: 40, cell: 34,
        mult: 2, winBonus: 300, par: 480
      },
      hard: {
        label: "HARD", cols: 16, rows: 20, mines: 66, cell: 32,
        mult: 3, winBonus: 700, par: 900
      }
    };

    const NUMBER_COLORS = [
      "", "#00ccff", "#00ff00", "#ffff00", "#ff9900",
      "#ff4444", "#ff66ff", "#ffffff", "#aaaaaa"
    ];

    let difficultyKey = "easy";
    let level = DIFFICULTIES.easy;
    let cols = 9;
    let rows = 9;
    let cell = 48;

    let mines = [];       // true where a mine is
    let counts = [];      // neighbouring mine count
    let opened = [];
    let flagged = [];
    let state = "ready";  // ready | playing | won | lost
    let minesPlaced = false;
    let openedCount = 0;
    let flagCount = 0;
    let startTime = 0;
    let endTime = 0;
    let explodedAt = -1;
    let flagMode = false;
    let score = 0;
    let pendingHighScore = false;
    let timerHandle = 0;


    function selectDifficulty(key) {

      if (!DIFFICULTIES[key]) {
        return;
      }

      difficultyKey = key;

      ["easy", "medium", "hard"].forEach(function(k) {
        const button = document.getElementById("diff-" + k);
        if (button) {
          button.classList.toggle("selected", k === key);
        }
      });

      const d = DIFFICULTIES[key];
      document.getElementById("difficultyNote").textContent =
        d.cols + " x " + d.rows + " GRID  //  " + d.mines + " MINES";
    }


    function showStartScreen(focusRank) {

      stopTimer();
      state = "ready";
      pendingHighScore = false;

      document.getElementById("startScreen").style.display = "block";
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("gameOverScreen").style.display = "none";

      loadLeaderboard(GAME_NAME, focusRank);
    }


    function showGameScreen() {
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "block";
      document.getElementById("gameOverScreen").style.display = "none";
    }


    function showGameOverScreen() {

      pendingHighScore = false;

      document.getElementById("startScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("gameOverScreen").style.display = "block";

      document.getElementById("finalScore").textContent = score;
      document.getElementById("gameOverTitle").textContent =
        state === "won" ? "SECTOR CLEAR" : "GAME OVER";
      document.getElementById("gameOverDetail").textContent =
        level.label + "  //  " + formatTime(elapsedSeconds()) +
        "  //  " + openedCount + " OF " + (cols * rows - level.mines) + " SQUARES";
    }


    /*
     * NEW GAME
     */
    function startGame() {

      hideHighScoreScreen();
      stopTimer();

      level = DIFFICULTIES[difficultyKey];
      cols = level.cols;
      rows = level.rows;

      // Hard is taller than wide; on a wide screen lay it on its side.
      if (rows > cols && window.innerWidth > window.innerHeight) {
        cols = level.rows;
        rows = level.cols;
      }

      cell = level.cell;
      canvas.width = cols * cell;
      canvas.height = rows * cell;
      canvas.style.maxWidth = canvas.width + "px";

      const total = cols * rows;
      mines = new Array(total).fill(false);
      counts = new Array(total).fill(0);
      opened = new Array(total).fill(false);
      flagged = new Array(total).fill(false);

      state = "ready";
      minesPlaced = false;
      openedCount = 0;
      flagCount = 0;
      startTime = 0;
      endTime = 0;
      explodedAt = -1;
      score = 0;
      pendingHighScore = false;
      setFlagMode(false);

      document.getElementById("hudLevel").textContent = level.label;

      showGameScreen();
      updateHud();
      draw();

      if (window.tgdFitGame) {
        window.tgdFitGame();
      }
    }


    // Mines are placed after the first dig, never on or around it,
    // so the first dig always opens an area.
    function placeMines(safeIndex) {

      const safe = {};
      neighbours(safeIndex).concat([safeIndex]).forEach(function(i) {
        safe[i] = true;
      });

      const spots = [];
      for (let i = 0; i !== cols * rows; i++) {
        if (!safe[i]) {
          spots.push(i);
        }
      }

      for (let n = 0; n !== level.mines; n++) {
        const pick = n + Math.floor(Math.random() * (spots.length - n));
        const tmp = spots[n];
        spots[n] = spots[pick];
        spots[pick] = tmp;
        mines[spots[n]] = true;
      }

      for (let i = 0; i !== cols * rows; i++) {
        counts[i] = neighbours(i).filter(function(j) { return mines[j]; }).length;
      }

      minesPlaced = true;
    }


    function neighbours(i) {

      const c = i % cols;
      const r = Math.floor(i / cols);
      const list = [];

      for (let dr = -1; dr !== 2; dr++) {
        for (let dc = -1; dc !== 2; dc++) {
          if (dr === 0 && dc === 0) {
            continue;
          }
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nc >= 0 && nr !== rows && nc !== cols) {
            list.push(nr * cols + nc);
          }
        }
      }

      return list;
    }


    /*
     * MOVES
     */
    function dig(i) {

      if (state === "won" || state === "lost" || flagged[i]) {
        return;
      }

      if (!minesPlaced) {
        placeMines(i);
        state = "playing";
        startTime = Date.now();
        startTimer();
      }

      if (opened[i]) {
        chord(i);
        return;
      }

      if (mines[i]) {
        explodedAt = i;
        lose();
        return;
      }

      openArea(i);
      checkWin();
    }


    // Opens a square; an empty one (no mines around) opens its
    // neighbours too, spreading until it reaches numbers.
    function openArea(start) {

      const stack = [start];

      while (stack.length) {
        const i = stack.pop();

        if (opened[i] || flagged[i] || mines[i]) {
          continue;
        }

        opened[i] = true;
        openedCount++;

        if (counts[i] === 0) {
          neighbours(i).forEach(function(j) {
            if (!opened[j]) {
              stack.push(j);
            }
          });
        }
      }
    }


    // Digging an opened number whose mines are all flagged opens
    // the rest of the squares around it.
    function chord(i) {

      if (counts[i] === 0) {
        return;
      }

      const around = neighbours(i);
      const flags = around.filter(function(j) { return flagged[j]; }).length;

      if (flags !== counts[i]) {
        return;
      }

      for (let k = 0; k !== around.length; k++) {
        const j = around[k];
        if (!opened[j] && !flagged[j]) {
          if (mines[j]) {
            explodedAt = j;
            lose();
            return;
          }
          openArea(j);
        }
      }

      checkWin();
    }


    function toggleFlag(i) {

      if (state === "won" || state === "lost" || opened[i]) {
        return;
      }

      flagged[i] = !flagged[i];
      flagCount += flagged[i] ? 1 : -1;
      updateHud();
    }


    function checkWin() {

      if (openedCount !== cols * rows - level.mines) {
        return;
      }

      state = "won";
      endTime = Date.now();
      stopTimer();

      // Flag every mine for the finished picture.
      for (let i = 0; i !== cols * rows; i++) {
        if (mines[i] && !flagged[i]) {
          flagged[i] = true;
          flagCount++;
        }
      }

      score =
        openedCount * level.mult +
        level.winBonus +
        Math.max(0, level.par - elapsedSeconds()) * level.mult;

      finish();
    }


    function lose() {

      state = "lost";
      endTime = Date.now();
      stopTimer();
      score = openedCount * level.mult;
      finish();
    }


    function finish() {

      updateHud();
      draw();

      // Let the player see the board before moving on.
      setTimeout(endGame, 1800);
    }


    function endGame() {

      if (pendingHighScore) {
        return;
      }

      if (score === 0) {
        showGameOverScreen();
        return;
      }

      google.script.run
        .withSuccessHandler(function(qualifies) {
          if (qualifies) {
            pendingHighScore = true;
            showHighScoreScreen(GAME_NAME, score);
          } else {
            showGameOverScreen();
          }
        })
        .withFailureHandler(function() {
          showGameOverScreen();
        })
        .qualifiesForHighScore(GAME_NAME, score);
    }


    /*
     * TIMER AND HUD
     */
    function elapsedSeconds() {
      if (!startTime) {
        return 0;
      }
      return Math.floor(((endTime || Date.now()) - startTime) / 1000);
    }

    function formatTime(s) {
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    function startTimer() {
      stopTimer();
      timerHandle = setInterval(updateHud, 250);
    }

    function stopTimer() {
      clearInterval(timerHandle);
      timerHandle = 0;
    }

    function updateHud() {
      document.getElementById("hudMines").textContent = level.mines - flagCount;
      document.getElementById("hudTime").textContent = formatTime(elapsedSeconds());
    }


    /*
     * DRAWING
     */
    function draw() {

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i !== cols * rows; i++) {
        const x = (i % cols) * cell;
        const y = Math.floor(i / cols) * cell;

        if (opened[i] || (state === "lost" && mines[i])) {
          drawOpen(i, x, y);
        } else {
          drawClosed(x, y);
          if (flagged[i]) {
            drawFlag(x, y);
            if (state === "lost" && !mines[i]) {
              drawCross(x, y);
            }
          }
        }
      }

      if (state === "won" || state === "lost") {
        drawBanner(state === "won" ? "SECTOR CLEAR" : "DETONATION");
      }
    }

    function drawClosed(x, y) {
      ctx.fillStyle = "#0b2a0b";
      ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
      ctx.fillStyle = "#1e5a1e";
      ctx.fillRect(x + 1, y + 1, cell - 2, 2);
      ctx.fillRect(x + 1, y + 1, 2, cell - 2);
      ctx.fillStyle = "#031003";
      ctx.fillRect(x + 1, y + cell - 3, cell - 2, 2);
      ctx.fillRect(x + cell - 3, y + 1, 2, cell - 2);
    }

    function drawOpen(i, x, y) {
      ctx.fillStyle = i === explodedAt ? "#661111" : "#000";
      ctx.fillRect(x, y, cell, cell);
      ctx.strokeStyle = "#123612";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);

      if (mines[i]) {
        drawMine(x, y);
        return;
      }

      if (counts[i] > 0) {
        ctx.fillStyle = NUMBER_COLORS[counts[i]];
        ctx.font = "bold " + Math.floor(cell * 0.62) + "px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(counts[i]), x + cell / 2, y + cell / 2 + 1);
      }
    }

    function drawFlag(x, y) {
      const s = cell;
      ctx.strokeStyle = "#cccccc";
      ctx.lineWidth = Math.max(1, s * 0.06);
      ctx.beginPath();
      ctx.moveTo(x + s * 0.38, y + s * 0.22);
      ctx.lineTo(x + s * 0.38, y + s * 0.78);
      ctx.stroke();
      ctx.fillStyle = "#ff9900";
      ctx.beginPath();
      ctx.moveTo(x + s * 0.40, y + s * 0.22);
      ctx.lineTo(x + s * 0.74, y + s * 0.36);
      ctx.lineTo(x + s * 0.40, y + s * 0.50);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#cccccc";
      ctx.fillRect(x + s * 0.26, y + s * 0.76, s * 0.26, Math.max(1, s * 0.06));
    }

    function drawMine(x, y) {
      const cx = x + cell / 2;
      const cy = y + cell / 2;
      const r = cell * 0.22;
      ctx.strokeStyle = "#ff4444";
      ctx.lineWidth = Math.max(1, cell * 0.06);
      ctx.beginPath();
      for (let a = 0; a !== 4; a++) {
        const ang = a * Math.PI / 4;
        ctx.moveTo(cx - Math.cos(ang) * r * 1.6, cy - Math.sin(ang) * r * 1.6);
        ctx.lineTo(cx + Math.cos(ang) * r * 1.6, cy + Math.sin(ang) * r * 1.6);
      }
      ctx.stroke();
      ctx.fillStyle = "#ff4444";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx - r * 0.5, cy - r * 0.5, r * 0.35, r * 0.35);
    }

    function drawCross(x, y) {
      ctx.strokeStyle = "#ff4444";
      ctx.lineWidth = Math.max(1, cell * 0.07);
      ctx.beginPath();
      ctx.moveTo(x + cell * 0.2, y + cell * 0.2);
      ctx.lineTo(x + cell * 0.8, y + cell * 0.8);
      ctx.moveTo(x + cell * 0.8, y + cell * 0.2);
      ctx.lineTo(x + cell * 0.2, y + cell * 0.8);
      ctx.stroke();
    }

    function drawBanner(text) {
      const h = Math.max(40, canvas.height * 0.14);
      const y = (canvas.height - h) / 2;
      ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
      ctx.fillRect(0, y, canvas.width, h);
      ctx.fillStyle = state === "won" ? "#00ff00" : "#ff4444";
      ctx.font = "bold " + Math.floor(h * 0.42) + "px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    }


    /*
     * INPUT
     * Mouse: left = dig, right = flag.
     * Touch: tap = dig (or flag in FLAG mode), hold = flag.
     */
    const HOLD_MS = 420;
    let press = null;

    function cellAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const c = Math.floor((clientX - rect.left) / rect.width * cols);
      const r = Math.floor((clientY - rect.top) / rect.height * rows);
      if (c >= 0 && r >= 0 && c !== cols && r !== rows) {
        return r * cols + c;
      }
      return -1;
    }

    canvas.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    canvas.addEventListener("pointerdown", function(e) {
      e.preventDefault();
      const i = cellAt(e.clientX, e.clientY);
      if (i === -1) {
        return;
      }

      if (e.pointerType === "mouse" && e.button === 2) {
        toggleFlag(i);
        draw();
        return;
      }

      press = { i: i, x: e.clientX, y: e.clientY, held: false, mouse: e.pointerType === "mouse" };

      if (!press.mouse) {
        press.timer = setTimeout(function() {
          if (press && !opened[press.i]) {
            press.held = true;
            toggleFlag(press.i);
            draw();
            if (navigator.vibrate) {
              navigator.vibrate(30);
            }
          }
        }, HOLD_MS);
      }
    });

    canvas.addEventListener("pointermove", function(e) {
      if (press && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > 12) {
        clearTimeout(press.timer);
        press = null;
      }
    });

    canvas.addEventListener("pointerup", function(e) {
      if (!press) {
        return;
      }
      clearTimeout(press.timer);
      const p = press;
      press = null;

      if (p.held || (p.mouse && e.button !== 0)) {
        return;
      }

      if (flagMode && !p.mouse && !opened[p.i]) {
        toggleFlag(p.i);
      } else {
        dig(p.i);
      }
      draw();
    });

    canvas.addEventListener("pointercancel", function() {
      if (press) {
        clearTimeout(press.timer);
        press = null;
      }
    });

    function setFlagMode(on) {
      flagMode = on;
      modeButton.textContent = on ? "MODE: FLAG" : "MODE: DIG";
      modeButton.classList.toggle("flag-mode", on);
    }

    modeButton.addEventListener("click", function() {
      setFlagMode(!flagMode);
    });


    setHighScoreReturnCallback(
      function(result) {
        showStartScreen(result && result.rank);
      }
    );

    selectDifficulty("easy");
    showStartScreen();

  </script>

<!-- ==========================================================
     SHARED GAME FIT (2026-11-06)
     Included at the end of every arcade game, after its own script.
     - Computers (mouse, no touch): the on-screen touch buttons are
       hidden; the keyboard plays.
     - Touch screens: the keyboard hints are hidden.
     - The game canvas shrinks (keeping its shape) so the whole game
       screen fits the window without scrolling. It never grows past
       the game's own size, and never below MIN_HEIGHT.
     No less-than characters in the script below (same rule as the
     Radar's included files).

<style>
  /* min-height: 100vh plus padding made some pages always scroll. */
  body {
    box-sizing: border-box;
  }

  @media (hover: hover) and (pointer: fine) {

    #controls {
      display: none !important;
    }
  }

  @media (hover: none), (pointer: coarse) {
    .instructions {
      display: none !important;
    }
  }

     touch buttons sit in a column on the right, beside it. */
  @media (pointer: coarse) and (orientation: landscape) and (max-height: 500px) {
    .controls,
    #controls {
      position: fixed !important;
      right: 10px !important;
      top: 50% !important;
      transform: translateY(-50%);
      width: 28vw !important;
      max-width: 260px !important;
      margin: 0 !important;
      z-index: 50;
    }

    #controls {
      grid-template-rows: 58px 58px !important;
    }

    /* Games with FIRE: arrows bottom-left for the left thumb, FIRE
       bottom-right for the right thumb, either side of the board. */
    .controls:has(.fire-button) {
      left: 10px !important;
      right: 10px !important;
      top: auto !important;
      bottom: 12px !important;
      transform: none;
      width: auto !important;
      max-width: none !important;
      display: flex !important;
      gap: 10px !important;
      pointer-events: none;
    }

    .controls:has(.fire-button) .control-button {
      pointer-events: auto;
      flex: 0 0 84px !important;
      width: 84px !important;
      height: 70px !important;
    }

    .controls:has(.fire-button) .fire-button {
      margin-left: auto !important;
      flex: 0 0 130px !important;
      width: 130px !important;
    }

    .controls .control-button,
    #controls .control-button,
    .controls .jump-button {
      height: 58px !important;
      min-height: 0 !important;
      padding: 0 6px !important;
      width: 100% !important;
      max-width: none !important;
      font-size: 1rem !important;
    }

    h1 {
      margin-top: 2px !important;
      margin-bottom: 2px !important;
      font-size: 1.4rem !important;
    }
  }

  /* Short windows (phones held sideways): a tighter start screen. */
  @media (max-height: 450px) {
    .subtitle {
      display: none !important;
    }

    .shared-leaderboard {
      margin: 4px auto 8px !important;
      padding: 6px 12px !important;
    }

    .shared-leaderboard-title {
      font-size: 1rem !important;
      margin-bottom: 4px !important;
      padding-bottom: 4px !important;
    }

    .shared-score-row {
      min-height: 30px !important;
      padding: 2px 5px !important;
      font-size: 0.95rem !important;
    }
    .game-button,
    .start-button,
    .play-again-button,
    .difficulty-button,
    .back-button {
      padding-top: 8px !important;
      padding-bottom: 8px !important;
      margin-top: 4px !important;
      margin-bottom: 4px !important;
    }

    .difficulty-label {
      margin: 2px 0 !important;
    }
  }
</style>
<script>
  (function() {

    var MIN_HEIGHT = 140;
    var SLACK = 6;

    function gameCanvas() {
      return document.querySelector("canvas");
    }

    function shown(el) {
      return !!el && el.offsetParent !== null;
    }

    // Lowest point of everything on the page except the canvas,
    // ignoring overlays (fixed / absolute) and hidden elements.
    // Overlays are skipped together with everything inside them.
    function contentBottom(skip) {
      var bottom = 0;

      function walk(parent) {
        var kids = parent.children;

        for (var i = 0; i !== kids.length; i++) {
          var el = kids[i];

          if (el === skip) {
            continue;
          }

          var cs = getComputedStyle(el);

          if (
            cs.display === "none" ||
            cs.position === "fixed" ||
            cs.position === "absolute"
          ) {
            continue;
          }

          var r = el.getBoundingClientRect();

          if (r.width !== 0 || r.height !== 0) {
            var b = r.bottom + (parseFloat(cs.marginBottom) || 0);

            if (b > bottom) {
              bottom = b;
            }
          }

          walk(el);
        }
      }

      walk(document.body);

      return bottom + window.scrollY;
    }

    // Start screen: the leaderboard list already scrolls inside its
    // own box; shrink that box so START stays on screen.
    var LIST_MIN_HEIGHT = 140;
    var LIST_MIN_HEIGHT_SHORT = 80;   // windows under 450 px tall

    function fitList() {
      var list = document.querySelector(".shared-leaderboard-scores");

      if (!shown(list)) {
        return;
      }

      list.style.height = "";

      var over =
        document.documentElement.scrollHeight - window.innerHeight;

      if (over > 0) {
        var current = list.getBoundingClientRect().height;
        list.style.height =
          Math.max(
            window.innerHeight >= 450 ? LIST_MIN_HEIGHT : LIST_MIN_HEIGHT_SHORT,
            Math.floor(current - over - SLACK)
          ) + "px";
      }
    }

    function fit() {
      fitList();

      var canvas = gameCanvas();

      if (!shown(canvas) || !canvas.width) {
        return;
      }

      canvas.style.width = "";
      canvas.style.height = "";

      var natural = canvas.getBoundingClientRect();
      var ratio = canvas.height / canvas.width;

      // Measure everything else with the canvas collapsed.
      canvas.style.height = "0px";
      var other = contentBottom(canvas);
      canvas.style.height = "";

      var available = window.innerHeight - other - SLACK;
      var naturalHeight = natural.width * ratio;

      var h = naturalHeight;

      if (naturalHeight > available) {
        h = Math.max(MIN_HEIGHT, Math.floor(available));
        setHeight(canvas, h, ratio);
      }

      // Padding and margins the measurement can't see: trim by
      // whatever still overflows (two passes at most).
      for (var pass = 0; pass !== 2; pass++) {
        var over =
          document.documentElement.scrollHeight - window.innerHeight;

        if (over > 0 && h > MIN_HEIGHT) {
          h = Math.max(MIN_HEIGHT, Math.floor(h - over - 1));
          setHeight(canvas, h, ratio);
        }
      }
    }

    function setHeight(canvas, h, ratio) {
      canvas.style.height = h + "px";
      canvas.style.width = Math.floor(h / ratio) + "px";
    }

    var timer = 0;

    function later() {
      clearTimeout(timer);
      timer = setTimeout(fit, 60);
    }

    window.tgdFitGame = fit;

    window.addEventListener("resize", later);
    window.addEventListener("orientationchange", later);
    document.addEventListener("click", later, true);
    document.addEventListener("keyup", later, true);

    // Screens change without a resize (START, game over): refit when
    // the canvas appears or the window size changes.
    var lastSignature = "";

    setInterval(function() {
      var canvas = gameCanvas();
      var signature =
        window.innerWidth + "x" + window.innerHeight + ":" +
        (shown(canvas) ? "on" : "off") + ":" +
        (shown(document.querySelector(".shared-leaderboard-scores")) ? "list" : "") + ":" +
        (canvas ? canvas.width + "x" + canvas.height : "");

      if (signature !== lastSignature) {
        lastSignature = signature;
        fit();
      }
    }, 400);

    fit();
  })();
</script>
